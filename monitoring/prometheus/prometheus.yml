# Prometheus for jobvacancy.uz (TZ OPS-04). Targets are Docker service names on the app's
# private networks (monitoring/docker-compose.monitoring.yml). Validate:
#   promtool check config monitoring/prometheus/prometheus.yml
#   promtool test rules monitoring/prometheus/tests/*.yml
#
# Timing budget for "an artificial failure reaches Telegram within 2 minutes": scrape 15 s +
# evaluation 15 s + the rule's `for` (critical rules: 1 m) + Alertmanager group_wait 10 s
# ≈ 1 m 40 s worst case.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    env: ${JV_ENV}
    domain: ${DOMAIN}

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Go API (http_*, db_pool_*, redis_pool_*, respcache_*): METRICS_ADDR :9091, back network.
  - job_name: api
    static_configs:
      - targets: ["api-1:9091", "api-2:9091"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance

  # River worker (pools; /healthz is the Docker healthcheck): WORKER_METRICS_ADDR :9092.
  - job_name: worker
    static_configs:
      - targets: ["worker:9092"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance

  # Host: this server's node_exporter on the monitoring network gateway, plus other hosts
  # (db-1) from NODE_EXPORTER_EXTRA_TARGETS. entrypoint.sh writes these file_sd lists (and
  # the blackbox ones below) from the environment, since Prometheus doesn't expand it.
  - job_name: node
    file_sd_configs:
      - files: ["/prometheus/sd/node.json"]

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Only compose containers; drop the per-cgroup noise cAdvisor also reports.
      - source_labels: [container_label_com_docker_compose_service]
        regex: ""
        action: drop

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { instance: postgres }

  - job_name: sql
    scrape_interval: 60s
    scrape_timeout: 20s
    static_configs:
      - targets: ["sql-exporter:9399"]
        labels: { instance: postgres }

  - job_name: redis
    metrics_path: /scrape
    static_configs:
      - targets: ["redis://redis-cache:6379", "redis://redis-state:6379"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: "redis://([^:]+):.*"
        target_label: instance
      - target_label: __address__
        replacement: redis-exporter:9121

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels: { instance: nginx }

  # MinIO cluster metrics (disk usage of media). MINIO_PROMETHEUS_AUTH_TYPE=public in the
  # app compose; the endpoint is only reachable on the back network.
  - job_name: minio
    scrape_interval: 60s
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
        labels: { instance: minio }

  # Through the origin: nginx:443 with the site's host name (our Let's Encrypt certificate,
  # SSR, API). The module carries the host name (blackbox/blackbox.yml).
  - job_name: blackbox-origin
    metrics_path: /probe
    file_sd_configs:
      - files: ["/prometheus/sd/origin.json"]
    relabel_configs: &blackbox-relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [module]
        target_label: __param_module
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Through Cloudflare, as visitors see it (edge certificate, DNS, WAF).
  - job_name: blackbox-public
    scrape_interval: 60s
    metrics_path: /probe
    file_sd_configs:
      - files: ["/prometheus/sd/public.json"]
    relabel_configs: *blackbox-relabel
