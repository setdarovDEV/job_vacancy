# nginx for jobvacancy.uz (TZ OPS-02, appendix A.2). Baked into the nginx image (nginx/Dockerfile).
# Site rules live in conf.d/, reusable blocks in snippets/. Validate: make nginx-test.

load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
worker_shutdown_timeout 30s;   # a reload must not wait forever for long-lived WebSockets
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;   # symlinked to stderr in the official image

events {
  worker_connections 8192;   # WebSockets hold a client and an upstream connection each
  multi_accept on;
}

http {
  include mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # One JSON line per request: request id ties it to the Go API log, urt/cache feed the
  # "SSR TTFB" and cache-hit panels (TZ §3). The IP is the real client (after real_ip).
  log_format jv escape=json '{"t":"$time_iso8601","rid":"$request_id","ip":"$remote_addr",'
    '"host":"$host","m":"$request_method","uri":"$request_uri","proto":"$server_protocol",'
    '"st":$status,"b":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time",'
    '"up":"$upstream_addr","cache":"$upstream_cache_status","ref":"$http_referer","ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log jv buffer=64k flush=2s;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  reset_timedout_connection on;
  server_names_hash_bucket_size 128;
  types_hash_max_size 4096;
  variables_hash_bucket_size 128;
  map_hash_bucket_size 128;

  # Request bodies: the API caps JSON at 1 MiB; file uploads go to object storage and get
  # their own limit in the /jv-* locations.
  client_max_body_size 1m;
  client_body_buffer_size 128k;
  client_header_timeout 15s;
  client_body_timeout 30s;
  send_timeout 30s;
  large_client_header_buffers 4 16k;

  # Docker's embedded DNS: upstream servers are re-resolved ("resolve"), so a recreated
  # api/web container with a new IP is picked up without a reload.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;

  # Compression (BE-06). nginx compresses; upstreams are asked for identity where we cache.
  brotli on;
  brotli_comp_level 5;
  brotli_min_length 512;
  brotli_types application/json application/javascript text/css text/plain text/xml application/xml
               application/rss+xml application/manifest+json application/ld+json image/svg+xml font/ttf;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain text/xml application/xml
             application/rss+xml application/manifest+json application/ld+json image/svg+xml font/ttf;

  proxy_buffer_size 16k;
  proxy_buffers 16 16k;
  proxy_busy_buffers_size 32k;
  proxy_temp_path /var/cache/nginx/proxy_temp 1 2;

  include conf.d/*.conf;
}
