# Production nginx for jobvacancy.uz.
# Replace jobvacancy.uz with your domain and run scripts/init-ssl.sh before first start.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    # Rate-limit zones (per IP and per user when authenticated by the backend).
    limit_req_zone $binary_remote_addr zone=api_ip:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_ip:10m rate=10r/m;

    upstream api {
        server api:8090;
    }

    upstream web {
        server web:3000;
    }

    upstream minio {
        server minio:8000;
    }

    # Redirect all HTTP to HTTPS, except certbot challenges.
    server {
        listen 80;
        server_name jobvacancy.uz www.jobvacancy.uz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name jobvacancy.uz www.jobvacancy.uz;

        ssl_certificate /etc/letsencrypt/live/jobvacancy.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jobvacancy.uz/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/jobvacancy.uz/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Object storage buckets (MinIO behind nginx so no extra subdomain is needed).
        # /media/ is a friendly alias for the public bucket.
        location /media/ {
            proxy_pass http://minio/jv-public/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Amz-Meta-*;
        }

        location /jv-public/ {
            proxy_pass http://minio/jv-public/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Amz-Meta-*;
        }

        location /jv-private/ {
            proxy_pass http://minio/jv-private/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Amz-Meta-*;
            proxy_buffering off;
        }

        # API and WebSocket.
        location /api/v1/ {
            limit_req zone=api_ip burst=120 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Client-Type $http_x_client_type;
        }

        # The API serves its socket at /api/v1/ws; without Upgrade headers it never connects.
        location /api/v1/ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Web app (React Router SSR).
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
