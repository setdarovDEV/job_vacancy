# Production stack for jobvacancy.uz (TZ OPS-01). Only nginx publishes ports (80, 443/tcp,
# 443/udp for HTTP/3); everything else talks over two private networks.
#
#   make deploy            # scripts/deploy.sh: pull → backup point → migrate → rolling restart
#   docker compose --env-file .env.production -f nginx/docker-compose.prod.yml config -q
#
# Variables come from the env file passed with --env-file (template: .env.production.example).
# Each service receives only the variables it needs (listed below), never the whole file.
#
# Profiles (COMPOSE_PROFILES in the env file):
#   db      Postgres on this host (single-server setup). Leave it out when the database runs
#           on its own VPS (DB_HOST=<private IP>) and start it there with the same file.
#   backup  pg-backup: daily full backup + retention to offsite S3 (WAL is archived by
#           Postgres itself). Runs next to Postgres.
#   tools   one-off commands: migrate, ctl (scripts/deploy.sh runs them).
name: ${COMPOSE_PROJECT_NAME:-jobvacancy}

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

# Settings shared by the Go api and worker (backend/internal/config/config.go).
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  WEB_URL: https://${DOMAIN:?set DOMAIN}
  HTTP_ADDR: ":8090"
  HTTP_CORS_ORIGINS: https://${DOMAIN}
  # nginx rewrites X-Real-IP (TZ SEC-02); only peers on the front network may set it.
  HTTP_TRUST_PROXY: "true"
  HTTP_TRUSTED_PROXIES: ${FRONT_SUBNET:-10.250.10.0/24}
  HTTP_COMPRESS: "off"          # nginx compresses (brotli + gzip)
  HTTP_DRAIN_DELAY: 5s          # /readyz turns 503 before the listener closes
  METRICS_ADDR: ":9091"         # scraped over the back network, never through nginx
  WORKER_METRICS_ADDR: ":9092"
  DATABASE_URL: postgres://${APP_DB_USER:-jobvacancy}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-jobvacancy}?sslmode=${DB_SSLMODE:-disable}
  # Rate limits, OTP codes, revocations, tickets, presence, pub/sub: must not be evicted.
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis-state:6379/0
  # Disposable caches (allkeys-lru). Read by the API once it splits cache from state.
  REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis-cache:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  JWT_KID: ${JWT_KID:-k1}
  JWT_PREVIOUS_SECRET: ${JWT_PREVIOUS_SECRET:-}
  JWT_PREVIOUS_KID: ${JWT_PREVIOUS_KID:-}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
  AUTH_COOKIE_SECURE: "true"
  GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
  SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TLS: ${SMTP_TLS:-starttls}
  SMTP_FROM: ${SMTP_FROM:-Job Vacancy <no-reply@jobvacancy.uz>}
  TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-jobvacancy_uz_bot}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET}
  # Object storage: the server talks to MinIO directly; browsers use presigned URLs on the
  # site's own host, which nginx routes to MinIO (/jv-public/, /jv-private/, /media/).
  S3_ENDPOINT: minio:9000
  S3_USE_SSL: "false"
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  S3_REGION: us-east-1
  S3_PUBLIC_ENDPOINT: ${DOMAIN}
  S3_PUBLIC_USE_SSL: "true"
  S3_PUBLIC_BUCKET: jv-public
  S3_PRIVATE_BUCKET: jv-private
  S3_PUBLIC_BASE_URL: https://${DOMAIN}/media
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: json
  LOG_REDACT: auto
  # Error tracking (TZ OPS-05): GlitchTip in monitoring/docker-compose.monitoring.yml, reached
  # over the private networks (http://<key>@glitchtip:8000/<project id>). Empty = off.
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${APP_ENV:-production}
  SENTRY_RELEASE: ${IMAGE_TAG:-dev}

x-api: &api
  <<: *hardening
  image: ${IMAGE_PREFIX:-ghcr.io/setdarovdev/jobvacancy}-backend:${IMAGE_TAG:-latest}
  build:
    context: ../backend
    args:
      VERSION: ${IMAGE_TAG:-dev}
      COMMIT: ${GIT_COMMIT:-unknown}
  command: ["/app/api"]
  environment:
    <<: *backend-env
    GOMEMLIMIT: 400MiB
  healthcheck:
    test: ["CMD", "/app/api", "healthcheck"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 20s
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  cap_drop: [ALL]
  stop_grace_period: 30s   # HTTP_DRAIN_DELAY 5s + HTTP_SHUTDOWN_TIMEOUT 15s + margin
  deploy:
    resources:
      limits: { cpus: "1.5", memory: 512M }
      reservations: { memory: 128M }
  networks: [front, back]
  depends_on:
    redis-state: { condition: service_healthy }
    redis-cache: { condition: service_healthy }
    minio: { condition: service_healthy }
    postgres: { condition: service_healthy, required: false }

x-web: &web
  <<: *hardening
  image: ${IMAGE_PREFIX:-ghcr.io/setdarovdev/jobvacancy}-web:${IMAGE_TAG:-latest}
  build:
    context: ../web
    args:
      VERSION: ${IMAGE_TAG:-dev}
      COMMIT: ${GIT_COMMIT:-unknown}
      VITE_SITE_URL: https://${DOMAIN}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_TELEGRAM_BOT: ${TELEGRAM_BOT_USERNAME:-jobvacancy_uz_bot}
      # Browser error reports (OPS-05): https://<key>@<domain>/errors/<project id>, same origin.
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: "3000"
    # Server-side renders reach the API through nginx's internal gateway (failover and
    # rolling-deploy draining, X-Real-IP of the visitor passed through).
    API_URL: http://nginx:8081/api/v1
    NODE_OPTIONS: --max-old-space-size=384
  read_only: true
  tmpfs: ["/tmp:size=32m"]
  cap_drop: [ALL]
  stop_grace_period: 15s
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 512M }
      reservations: { memory: 128M }
  networks: [front]

services:
  nginx:
    <<: *hardening
    image: ${IMAGE_PREFIX:-ghcr.io/setdarovdev/jobvacancy}-nginx:${NGINX_TAG:-latest}
    build:
      context: .
      args:
        VERSION: ${IMAGE_TAG:-dev}
        COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:80:80"
      - "${HTTP_BIND:-0.0.0.0}:443:443"
      - "${HTTP_BIND:-0.0.0.0}:443:443/udp"   # HTTP/3
    environment:
      CERT_NAME: jobvacancy
      STAGING_BASIC_AUTH: ${STAGING_BASIC_AUTH:-}
      NGINX_RELOAD_INTERVAL: "21600"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    networks: [front]

  # Let's Encrypt (TZ OPS-02): `make cert` issues the first certificate; this container
  # renews it twice a day and nginx reloads every 6 h (bin/jv-reload) to pick it up.
  certbot:
    <<: *hardening
    image: certbot/dns-cloudflare:v5.8.0@sha256:c45edb002b883da1a1235abb205dff474a7a1a459d878e8d5fdc7f9d83073aea
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --quiet --no-random-sleep-on-renew; sleep 12h & wait $${!}; done"]
    volumes:
      - letsencrypt:/etc/letsencrypt      # DNS-01 token lives in .secrets/ here (scripts/cert.sh)
      - acme-webroot:/var/www/certbot
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    networks: [edge]

  web-1: *web
  web-2: *web

  api-1: *api
  api-2: *api

  worker:
    <<: *api
    command: ["/app/worker"]
    environment:
      <<: *backend-env
      GOMEMLIMIT: 600MiB
      WORKER_CRITICAL_WORKERS: ${WORKER_CRITICAL_WORKERS:-10}
      WORKER_DEFAULT_WORKERS: ${WORKER_DEFAULT_WORKERS:-20}
      WORKER_SHUTDOWN_TIMEOUT: 30s
    healthcheck:
      test: ["CMD", "/app/worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 45s   # River Stop, then StopAndCancel after WORKER_SHUTDOWN_TIMEOUT
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
        reservations: { memory: 128M }
    networks: [back]

  # One-off: `docker compose run --rm migrate` (scripts/deploy.sh does it before the API).
  migrate:
    <<: *api
    profiles: [tools]
    restart: "no"
    command: ["/app/migrate", "up"]
    healthcheck: { disable: true }
    networks: [back]

  ctl:
    <<: *api
    profiles: [tools]
    restart: "no"
    entrypoint: ["/app/ctl"]
    command: []
    healthcheck: { disable: true }
    networks: [back]

  redis-cache:
    <<: *hardening
    image: redis:8.10.2-alpine@sha256:72cedd9603038893af961e90ac5e1a1a0d8377d5e338dbdad8fe284ea25de18f
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}",
              "--maxmemory", "${REDIS_CACHE_MAXMEMORY:-512mb}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ./redis/cache.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 640M }
    networks: [back]

  redis-state:
    <<: *hardening
    image: redis:8.10.2-alpine@sha256:72cedd9603038893af961e90ac5e1a1a0d8377d5e338dbdad8fe284ea25de18f
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}",
              "--maxmemory", "${REDIS_STATE_MAXMEMORY:-384mb}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ./redis/state.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-state:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
    networks: [back]

  # MinIO community images are no longer published; this is the last maintained build of
  # the final community release line, pinned by digest (docs/RUNBOOK.md "MinIO").
  minio:
    <<: *hardening
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT: "false"
      MINIO_UPDATE: "off"
      # /minio/v2/metrics/cluster without a token: MinIO is only on the private networks and
      # nginx never routes that path (Prometheus scrapes it, OPS-04).
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9201}:9001"   # console via SSH tunnel only
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    networks: [front, back]

  # The API's own MinIO user (never the root credentials), limited to the two buckets.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
    restart: "no"
    logging: *logging
    entrypoint: ["/bin/sh", "/opt/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./scripts/minio-init.sh:/opt/minio-init.sh:ro
    depends_on:
      minio: { condition: service_healthy }
    networks: [back]

  postgres:
    <<: *hardening
    profiles: [db]
    image: ${IMAGE_PREFIX:-ghcr.io/setdarovdev/jobvacancy}-postgres:${POSTGRES_TAG:-latest}
    build: ./postgres
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf",
              "-c", "shared_buffers=${PG_SHARED_BUFFERS:-2GB}",
              "-c", "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-6GB}"]
    environment: &pg-env
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-jobvacancy}
      APP_DB_USER: ${APP_DB_USER:-jobvacancy}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD:-}
      PGDATA: /var/lib/postgresql/18/docker
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    ports:
      # Loopback by default (psql over SSH). On a dedicated db-1 set DB_PUBLISH to the
      # private interface, e.g. 10.0.0.3:5432, and firewall it to app-1.
      - "${DB_PUBLISH:-127.0.0.1:5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "${PG_CPUS:-4}", memory: "${PG_MEMORY:-7G}" }
    networks: [back]

  # Daily full backup at BACKUP_HOUR_UTC + retention (TZ OPS-03). Same image; reads the
  # data volume read-only and talks to Postgres for pg_backup_start/stop.
  pg-backup:
    <<: *hardening
    profiles: [backup]
    image: ${IMAGE_PREFIX:-ghcr.io/setdarovdev/jobvacancy}-postgres:${POSTGRES_TAG:-latest}
    build: ./postgres
    user: postgres
    entrypoint: ["/usr/local/bin/walg-backup-loop"]
    environment:
      <<: *pg-env
      PGHOST: ${DB_HOST:-postgres}
      PGPORT: ${DB_PORT:-5432}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PGDATABASE: postgres
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-21}
      BACKUP_RETAIN_FULL: ${BACKUP_RETAIN_FULL:-14}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    volumes:
      - pgdata:/var/lib/postgresql:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/walg-status"]
      interval: 1h
      timeout: 60s
      retries: 2
      start_period: 2h
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    depends_on:
      postgres: { condition: service_healthy, required: false }
    networks: [back]

  # Point-in-time restore into a NEW volume (scripts/restore.sh, scripts/staging-refresh.sh):
  #   RESTORE_VOLUME=<new volume> docker compose run --rm pg-restore [--time|--name] --start --check
  # RESTORE_S3_* read another environment's archive (staging restores production's backups
  # with a read-only key); by default it reads this environment's own BACKUP_S3_*.
  pg-restore:
    profiles: [restore]
    image: ${IMAGE_PREFIX:-ghcr.io/setdarovdev/jobvacancy}-postgres:${POSTGRES_TAG:-latest}
    build: ./postgres
    restart: "no"
    logging: *logging
    user: postgres
    entrypoint: ["/usr/local/bin/walg-restore"]
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_DB: ${DB_NAME:-jobvacancy}
      PG_SHARED_BUFFERS: ${PG_SHARED_BUFFERS:-2GB}
      PG_EFFECTIVE_CACHE_SIZE: ${PG_EFFECTIVE_CACHE_SIZE:-6GB}
      BACKUP_ENABLED: "false"
      BACKUP_S3_PREFIX: ${RESTORE_S3_PREFIX:-${BACKUP_S3_PREFIX:-}}
      BACKUP_S3_ENDPOINT: ${RESTORE_S3_ENDPOINT:-${BACKUP_S3_ENDPOINT:-}}
      BACKUP_S3_REGION: ${RESTORE_S3_REGION:-${BACKUP_S3_REGION:-us-east-1}}
      BACKUP_S3_ACCESS_KEY: ${RESTORE_S3_ACCESS_KEY:-${BACKUP_S3_ACCESS_KEY:-}}
      BACKUP_S3_SECRET_KEY: ${RESTORE_S3_SECRET_KEY:-${BACKUP_S3_SECRET_KEY:-}}
      BACKUP_ENCRYPTION_KEY: ${RESTORE_ENCRYPTION_KEY:-${BACKUP_ENCRYPTION_KEY:-}}
    volumes:
      - restore-target:/var/lib/postgresql
    shm_size: 1g
    networks: [edge]

networks:
  # nginx ↔ web ↔ api (+ MinIO for /media). The API trusts X-Real-IP only from here.
  front:
    ipam:
      config:
        - subnet: ${FRONT_SUBNET:-10.250.10.0/24}
  # api/worker ↔ Postgres, Redis, MinIO.
  back:
    ipam:
      config:
        - subnet: ${BACK_SUBNET:-10.250.20.0/24}
  # certbot: internet only (DNS-01 API calls, ACME).
  edge: {}

volumes:
  # The live database volume. scripts/restore.sh switches PGDATA_VOLUME to a restored copy
  # and keeps the old one for forensics.
  pgdata:
    name: ${PGDATA_VOLUME:-${COMPOSE_PROJECT_NAME:-jobvacancy}_pgdata}
  restore-target:
    name: ${RESTORE_VOLUME:-${COMPOSE_PROJECT_NAME:-jobvacancy}_pgdata_restore}
  redis-state:
  minio:
  letsencrypt:
  acme-webroot:
  nginx-cache:
