# Production stack for jobvacancy.uz.
# Copy nginx/.env.example -> .env, fill secrets, then:
#   docker compose -f nginx/docker-compose.prod.yml up -d
name: jobvacancy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c max_connections=200
        -c random_page_cost=1.1
        -c effective_cache_size=1GB
        -c log_min_duration_statement=200
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  minio:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: ["server", "-s3", "-dir=/data", "-s3.port=8000"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      WEED_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      WEED_S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      AUTH_COOKIE_SECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/app/api"]
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME}
      WEB_URL: ${WEB_URL}
      HTTP_ADDR: :8090
      METRICS_ADDR: 0.0.0.0:9091
      HTTP_TRUST_PROXY: "true"
      HTTP_CORS_ORIGINS: ${HTTP_CORS_ORIGINS}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DB_MAX_CONNS: "50"
      DB_MIN_CONNS: "5"
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWTISSUER: ${JWT_ISSUER}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN}
      AUTH_COOKIE_SECURE: "true"
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TLS: ${SMTP_TLS}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      S3_ENDPOINT: minio:8000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_PUBLIC_USE_SSL: ${S3_PUBLIC_USE_SSL}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: json
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/app/worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      WEB_URL: ${WEB_URL}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_COOKIE_SECURE: "true"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TLS: ${SMTP_TLS}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      S3_ENDPOINT: minio:8000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: json
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8090
    depends_on:
      - api
    networks:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-data:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - api
      - web
    networks:
      - backend

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks:
      - backend

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    networks:
      - backend

  backup:
    image: offen/docker-volume-backup:latest
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "0 3 * * *"
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_FILENAME: backup-%Y-%m-%dT%H-%M-%S.tar.gz
      AWS_S3_BUCKET_NAME: ${BACKUP_S3_BUCKET}
      AWS_S3_PATH: jobvacancy/
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY}
      AWS_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      AWS_S3_REGION: ${BACKUP_S3_REGION}
      AWS_S3_FORCE_PATH_STYLE: "true"
      BACKUP_ARCHIVE: "/backup/data.tar.gz"
      BACKUP_STOP_CONTAINER_LABEL: jobvacancy.backup.stop
    volumes:
      - pgdata:/backup/pgdata:ro
      - miniodata:/backup/miniodata:ro
      - redisdata:/backup/redisdata:ro
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  certbot-data:
  certbot-www:
  prometheus-data:
  grafana-data:
