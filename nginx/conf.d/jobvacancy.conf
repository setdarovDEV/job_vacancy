# jobvacancy.uz — public entry point (TZ OPS-02 / appendix A.2, SEC-02 real IP, SEC-03 headers).
#
#   /                 → web ×2 (React Router SSR), anonymous HTML micro-cached 30 s
#   /assets/          → web, hashed files: 1 year immutable
#   /api/             → api ×2 (Go), /api/v1/ws upgraded to WebSocket
#   /media/           → MinIO public bucket (avatars, logos), read-only
#   /jv-public/, /jv-private/ → MinIO S3 API for presigned uploads and signed downloads
#
# Maps, limit zones and caches: 00-maps.conf. Upstreams: 10-upstreams.conf.
# Staging (OPS-08) is the same config under staging.jobvacancy.uz (noindex via $jv_env).

# ---- port 80: ACME challenges, then HTTPS ------------------------------------------------
server {
  listen 80 default_server;
  server_name _;
  include snippets/cloudflare-real-ip.conf;
  real_ip_header CF-Connecting-IP;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- 443: unknown names get no certificate at all ------------------------------------------
server {
  listen 443 ssl default_server;
  listen 443 quic reuseport default_server;
  http2 on;
  server_name _;
  ssl_reject_handshake on;
}

# ---- www → apex ----------------------------------------------------------------------------
server {
  listen 443 ssl;
  listen 443 quic;
  http2 on;
  server_name www.jobvacancy.uz;
  include snippets/ssl.conf;
  include snippets/security-headers.conf;
  return 301 https://jobvacancy.uz$request_uri;
}

# ---- the site --------------------------------------------------------------------------------
server {
  listen 443 ssl;
  listen 443 quic;
  http2 on;
  server_name jobvacancy.uz staging.jobvacancy.uz;

  include snippets/ssl.conf;
  include snippets/cloudflare-real-ip.conf;   # set_real_ip_from <Cloudflare IPv4/IPv6 ranges>
  real_ip_header CF-Connecting-IP;
  include snippets/security-headers.conf;
  # Staging only: HTTP basic auth when STAGING_BASIC_AUTH is set (written at container start).
  include /etc/nginx/runtime/auth*.conf;

  error_page 502 503 504 /50x.html;
  location = /50x.html {
    internal;
    root /usr/share/nginx/html/jv;
    include snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;
  }

  # Hashed build output: cached here and at the edge for a year.
  location ^~ /assets/ {
    proxy_pass http://web;
    include snippets/proxy-common.conf;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";   # cache identity bytes; nginx compresses per client
    proxy_ignore_headers Vary;             # ...so Node's "Vary: Accept-Encoding" must not split it
    proxy_cache static;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 10s;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_lock on;
    expires 1y;
    include snippets/security-headers.conf;
    add_header Cache-Control "public, immutable";
    add_header X-Cache $upstream_cache_status always;
  }

  # WebSocket (chat, badges, presence). Ticket and presence endpoints are plain /api/ calls.
  location = /api/v1/ws {
    proxy_pass http://api;
    include snippets/proxy-common.conf;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
    limit_conn ws_per_ip 300;
  }

  # Telegram calls the bot webhook from its own servers: never behind staging basic auth.
  location = /api/v1/telegram/webhook {
    auth_basic off;
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://api;
    include snippets/proxy-common.conf;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
  }

  # Browser error reports for GlitchTip (TZ OPS-05, Sentry protocol): the web's DSN is
  # https://<key>@<site>/errors/<project>, so reports stay same-origin (CSP connect-src 'self',
  # no third-party domain for blockers). Only the ingestion endpoints are exposed; the
  # GlitchTip UI is reached over an SSH tunnel. GlitchTip runs in the monitoring compose
  # project (network alias "glitchtip"); while it is down reports are dropped with 204.
  location ~ ^/errors/api/([0-9]+)/(envelope|store)/$ {
    limit_except POST { deny all; }
    limit_req zone=errors burst=20 nodelay;
    client_max_body_size 1m;
    set $glitchtip glitchtip:8000;
    proxy_pass http://$glitchtip/api/$1/$2/$is_args$args;
    include snippets/proxy-common.conf;
    proxy_set_header Host glitchtip;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    error_page 404 502 503 504 = @errors_unavailable;
  }
  location @errors_unavailable {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 204;
  }

  location /api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://api;
    include snippets/proxy-common.conf;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;   # the API's own deadline is 8 s; PDF export gets longer
    proxy_next_upstream error timeout http_502;
    proxy_next_upstream_tries 2;
    error_page 429 = @api_rate_limited;
    error_page 502 503 504 = @api_unavailable;
  }
  # Errors nginx itself produces for the API speak the API's error format.
  location @api_rate_limited {
    default_type application/json;
    include snippets/security-headers.conf;
    add_header Retry-After "1" always;
    return 429 '{"error":{"code":"rate_limited","message":"too many requests, try again later","retry_after":1}}';
  }
  location @api_unavailable {
    default_type application/json;
    include snippets/security-headers.conf;
    add_header Retry-After "30" always;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":{"code":"service_unavailable","message":"service temporarily unavailable"}}';
  }

  # Public bucket (avatars, logos): object keys are unique per upload, so cache hard.
  location ^~ /media/ {
    limit_except GET { deny all; }
    proxy_pass http://minio/jv-public/;
    include snippets/proxy-common.conf;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";   # anonymous reads only
    include snippets/minio-response.conf;
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie;
    proxy_intercept_errors on;
    error_page 400 403 404 = @media_missing;
    proxy_cache static;
    proxy_cache_valid 200 1d;
    proxy_cache_use_stale error timeout updating;
    expires 30d;
    include snippets/security-headers.conf;
    add_header X-Cache $upstream_cache_status always;
  }
  location @media_missing {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 404;
  }

  # S3 API for presigned POST uploads and signed GET downloads (S3_PUBLIC_ENDPOINT is this
  # host). SigV4 signs the Host header, so it is passed through unchanged. Same origin as
  # the site, so no CORS. Max object 25 MB (file module); uploads stream straight through.
  location ~ ^/jv-(public|private)(/|$) {
    limit_except GET POST { deny all; }
    limit_req zone=uploads burst=20 nodelay;
    client_max_body_size 26m;
    client_body_timeout 120s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://minio;
    include snippets/proxy-common.conf;
    proxy_set_header Host $http_host;   # SigV4 signs the Host the browser used
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    include snippets/minio-response.conf;
  }

  location = /robots.txt {
    default_type text/plain;
    if ($jv_env = staging) {
      return 200 "User-agent: *\nDisallow: /\n";
    }
    proxy_pass http://web;
    include snippets/proxy-common.conf;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
  }

  # Everything else is the SSR web app. Anonymous HTML is micro-cached for 30 s per URL and
  # per theme/glass cookie (the HTML depends on them, FE-02); signed-in users (jv_auth=1)
  # always get a fresh render. Responses with Set-Cookie or Cache-Control: private/no-store
  # are never stored.
  location / {
    limit_req zone=pages burst=80 nodelay;
    proxy_pass http://web;
    include snippets/proxy-common.conf;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";   # one identity copy per key; nginx compresses
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502;
    proxy_next_upstream_tries 2;

    proxy_cache ssr;
    # The key is the only variance: upstream Vary (Node adds Accept-Encoding) is ignored, so
    # anonymous SSR must not depend on any other request header or cookie.
    proxy_ignore_headers Vary;
    proxy_cache_key "$scheme$host$request_uri|$cookie_jv_theme|$cookie_jv_glass";
    proxy_cache_bypass $no_ssr_cache;
    proxy_no_cache $no_ssr_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 30s;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;

    include snippets/security-headers.conf;
    add_header X-Cache $upstream_cache_status always;
    add_header X-Request-ID $request_id always;
  }
}
