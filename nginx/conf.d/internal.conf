# Internal listeners. Their ports are never published (docker-compose.prod.yml), and they
# only answer private (Docker network) addresses.

# SSR → API gateway (API_URL=http://nginx:8081/api/v1 on web-1/web-2). Going through the
# upstream gives server-side renders the same failover and rolling-deploy draining as
# browsers. X-Real-IP is the visitor address the web copied from our own header
# (forwardHeaders in web/app/shared/seo/seo.ts), so API rate limits stay per visitor.
server {
  listen 8081;
  server_name _;
  access_log off;   # the API logs every call with the same request id
  allow 127.0.0.1;
  allow 10.0.0.0/8;
  allow 172.16.0.0/12;
  allow 192.168.0.0/16;
  deny all;

  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_real_ip;
    proxy_set_header X-Request-ID $rid_internal;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502;
    proxy_next_upstream_tries 2;
  }
  location = /healthz {
    return 200 "ok\n";
  }
}

# Health (Docker healthcheck, deploy script) and stub_status for nginx-prometheus-exporter.
server {
  listen 8082;
  server_name _;
  access_log off;
  allow 127.0.0.1;
  allow 10.0.0.0/8;
  allow 172.16.0.0/12;
  allow 192.168.0.0/16;
  deny all;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }
  location = /nginx_status {
    stub_status;
  }
}
