# Application instances (docker compose services, see docker-compose.prod.yml).
#
# "resolve" re-resolves the names through Docker DNS, so a recreated container (new IP) is
# picked up without a reload, and nginx starts even while an instance is missing.
# Rolling deploys drain one instance at a time: bin/jv-upstream appends "down" to the line
# tagged "# jv:<name>" and reloads (scripts/deploy.sh). Keep one server per line.

upstream api {
  zone upstream_api 128k;
  least_conn;
  server api-1:8090 resolve max_fails=3 fail_timeout=10s;   # jv:api-1
  server api-2:8090 resolve max_fails=3 fail_timeout=10s;   # jv:api-2
  keepalive 64;
  keepalive_timeout 50s;   # below the Go server's idle timeout (120s): nginx closes first
}

upstream web {
  zone upstream_web 128k;
  least_conn;
  server web-1:3000 resolve max_fails=3 fail_timeout=10s;   # jv:web-1
  server web-2:3000 resolve max_fails=3 fail_timeout=10s;   # jv:web-2
  keepalive 32;
  keepalive_timeout 4s;    # Node closes idle sockets after 5s; reuse must never race that
}

upstream minio {
  zone upstream_minio 64k;
  server minio:9000 resolve max_fails=3 fail_timeout=10s;
  keepalive 16;
  keepalive_timeout 20s;
}
