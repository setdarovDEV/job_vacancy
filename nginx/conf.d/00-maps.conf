# Shared maps, limit zones and caches (http context). See jobvacancy.conf for their use.

# SSR micro-cache bypass: the web sets the readable marker cookie jv_auth=1 after sign-in and
# root.tsx renders the signed-in shell for it (hasSession), so those pages are never cached.
map $http_cookie $no_ssr_cache {
  default 0;
  "~(^|;\s*)jv_auth=1" 1;
}

# WebSocket upgrade on /api/v1/ws; plain keep-alive to the upstream otherwise.
map $http_upgrade $connection_upgrade {
  default upgrade;
  "" "";
}

# Environment by host name (OPS-08): staging answers noindex and a Disallow-all robots.txt.
map $host $jv_env {
  default production;
  staging.jobvacancy.uz staging;
}
map $jv_env $robots_tag {
  staging "noindex, nofollow";
  default "";
}

# Request id: nginx generates one per request and hands it to the API (X-Request-ID is what
# the Go RequestID middleware logs). On the internal SSR gateway the web may pass its own.
map $http_x_request_id $rid_internal {
  "" $request_id;
  default $http_x_request_id;
}

# Content-Security-Policy (SEC-03), chosen per area in snippets/security-headers.conf.
# HTML: the web SSR sends its own nonce-based policy; while it doesn't, this fallback applies
# (inline boot scripts need 'unsafe-inline' until the nonce lands). Google Identity Services
# and Cloudflare Turnstile (SEC-04) are the only third parties.
map $upstream_http_content_security_policy $csp_html {
  "" "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/ https://challenges.cloudflare.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
  default "";
}
map $uri $csp {
  # JSON API: nothing may render from it.
  "~^/api/" "default-src 'none'; frame-ancestors 'none'; base-uri 'none'";
  # User uploads (images, voice, attachments): never executable, even if a type slips through.
  "~^/(media|jv-public|jv-private)/" "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'; sandbox";
  default $csp_html;
}

# ---- rate limits (per real client IP, after real_ip) ------------------------------------
# api: appendix A.2. pages: SSR is the most expensive thing a bot can hit uncached.
limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=pages:20m rate=20r/s;
# uploads: POSTs to object storage only; signed GETs (a chat full of images) are not limited.
map $request_method $upload_limit_key {
  POST $binary_remote_addr;
  default "";
}
limit_req_zone $upload_limit_key zone=uploads:10m rate=5r/s;
# errors: browser error reports to GlitchTip (/errors/, OPS-05); a crash loop must not flood it.
limit_req_zone $binary_remote_addr zone=errors:10m rate=2r/s;
# Generous: mobile carriers put many users behind one CGNAT address (SEC-04).
limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

# ---- caches -------------------------------------------------------------------------------
# ssr: anonymous HTML micro-cache (30 s). static: hashed /assets and public /media objects.
proxy_cache_path /var/cache/nginx/ssr levels=1:2 keys_zone=ssr:50m max_size=1g inactive=10m use_temp_path=off;
proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:20m max_size=2g inactive=7d use_temp_path=off;
