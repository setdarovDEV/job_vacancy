# PostgreSQL 18 for jobvacancy.uz (TZ OPS-03). Sized for db-1: 4 vCPU / 8 GB RAM / NVMe.
# Baked into the postgres image (nginx/postgres/Dockerfile). shared_buffers and
# effective_cache_size are passed on the command line from PG_SHARED_BUFFERS /
# PG_EFFECTIVE_CACHE_SIZE so a smaller host (staging, single server) can shrink them.

# ---- connections ---------------------------------------------------------------------------
listen_addresses = '*'
max_connections = 200            # api 2×20 + worker 35 + migrate/ctl/backup/monitoring headroom
superuser_reserved_connections = 5
password_encryption = scram-sha-256

# ---- memory ----------------------------------------------------------------------------------
shared_buffers = 2GB             # 25% of RAM
effective_cache_size = 6GB       # 75% of RAM
work_mem = 16MB
maintenance_work_mem = 512MB     # index builds (CREATE INDEX CONCURRENTLY), vacuum
autovacuum_work_mem = 256MB
huge_pages = try

# ---- planner (SSD/NVMe) ----------------------------------------------------------------------
# 1.1, not the HDD default 4: otherwise broad searches skip the full-text GIN index and
# seq-scan instead (measured 3x slower, docs/PLAN.md section 11).
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200
default_statistics_target = 100

# ---- parallelism (4 vCPU) --------------------------------------------------------------------
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ---- WAL, checkpoints, archiving (wal-g -> offsite S3) ---------------------------------------
wal_level = replica
wal_compression = zstd
wal_buffers = 16MB
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
archive_mode = on
# walg-archive-wal: wal-g wal-push, or a no-op when BACKUP_ENABLED=false (staging).
archive_command = '/usr/local/bin/walg-archive-wal %p'
# Close a WAL segment at least every minute so the offsite copy is never more than about a
# minute behind (RPO <= 5 min, TZ section 3). Idle segments compress to almost nothing.
archive_timeout = 60
max_wal_senders = 5              # pg_basebackup / a future streaming replica
wal_keep_size = 1GB

# ---- statistics and slow queries -------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.max = 10000
pg_stat_statements.track = top
pg_stat_statements.track_utility = off
track_io_timing = on
track_functions = pl
compute_query_id = on
# auto_explain: plans of statements slower than 200 ms go to the log (TZ OPS-03).
auto_explain.log_min_duration = '200ms'
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = off    # per-node timing is the expensive part of ANALYZE
auto_explain.log_triggers = on
auto_explain.log_format = text
auto_explain.sample_rate = 1

# ---- logging (stderr -> docker logs) ---------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 200ms
log_line_prefix = '%m [%p] %q%u@%d app=%a '
log_checkpoints = on
log_lock_waits = on
deadlock_timeout = 1s
log_temp_files = 16MB
log_autovacuum_min_duration = 1s
log_timezone = 'UTC'

# ---- autovacuum (hot counters on vacancies, conversations) ----------------------------------
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000

# ---- safety nets (the app sets tighter per-pool limits, BE-01) ------------------------------
idle_in_transaction_session_timeout = 60s
tcp_keepalives_idle = 60

# ---- locale ----------------------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
