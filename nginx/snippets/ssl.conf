# TLS (Mozilla "intermediate": TLS 1.2 + 1.3, forward secrecy only) — SSL Labs A+ together
# with HSTS. The certificate is Let's Encrypt (certbot service); until it is issued the
# entrypoint links a self-signed placeholder at the same path so nginx can start.
# No OCSP stapling: Let's Encrypt shut its OCSP responders down in 2025.
ssl_certificate     /etc/nginx/tls/fullchain.pem;
ssl_certificate_key /etc/nginx/tls/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_session_cache shared:SSL:20m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_early_data off;   # 0-RTT data is replayable
