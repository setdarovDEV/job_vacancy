# Upstream request headers shared by every proxied location. The client address is
# REWRITTEN, never appended: whatever X-Real-IP / X-Forwarded-For the client sent is dropped
# (TZ SEC-02), so the API's rate limits see the real address set by real_ip.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 3s;
