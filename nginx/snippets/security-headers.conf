# Security headers (TZ SEC-03). Included in the server AND in every location that sets its
# own add_header: nginx drops inherited add_header directives as soon as a level adds one.
# "always" keeps them on error responses too. Empty values ($robots_tag, $csp for HTML the
# web already covered) are not sent.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), display-capture=(), publickey-credentials-get=(self)" always;
# Google sign-in opens a popup that must be able to talk back to this window.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Content-Security-Policy $csp always;
add_header X-Robots-Tag $robots_tag always;
# HTTP/3 advertisement (the quic listener shares port 443/udp).
add_header Alt-Svc 'h3=":443"; ma=86400' always;
