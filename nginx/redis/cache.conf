# redis-cache: disposable response/list/suggest caches (TZ OPS-01). Evicts least recently
# used keys when full and never touches the disk: losing it only costs a few cache misses.
# The password is passed on the command line (docker-compose.prod.yml).
bind 0.0.0.0
protected-mode yes
port 6379
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 10
save ""
appendonly no
tcp-keepalive 60
timeout 0
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
latency-monitor-threshold 50
