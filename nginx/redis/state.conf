# redis-state: things that must not silently disappear — rate-limit counters, OTP codes,
# revoked tokens, WebSocket tickets, presence, view counters, pub/sub (TZ OPS-01).
# noeviction: a full instance fails writes loudly instead of dropping state; AOF (fsync
# every second) survives a restart.
bind 0.0.0.0
protected-mode yes
port 6379
maxmemory 256mb
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 3600 1 300 100
dir /data
tcp-keepalive 60
timeout 0
latency-monitor-threshold 50
