name: uptime

# External uptime check (TZ OPS-04 "tashqi uptime monitoring"): runs outside our servers, so
# it also catches what in-server monitoring cannot see (VPS down, network, DNS, Cloudflare,
# certificate). Every 10 minutes the public site, the API and the certificate are checked
# from GitHub's network; a failure (after one retry) goes straight to the on-call Telegram chat.
# Complements a dedicated uptime service (UptimeRobot / Better Stack, docs/RUNBOOK.md §10):
# GitHub's scheduler can run late, so this is the backup, not the only check.
#
# Repository settings: variable PUBLIC_URL (e.g. https://jobvacancy.uz; the job is skipped
# while it is empty), secrets UPTIME_TELEGRAM_BOT_TOKEN and UPTIME_TELEGRAM_CHAT_ID.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: vars.PUBLIC_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site, API and certificate
        id: check
        env:
          URL: ${{ vars.PUBLIC_URL }}
        run: |
          fail=()
          probe() { # probe <path> <expected regex>
            local code
            for attempt in 1 2; do
              code=$(curl -sS -o /dev/null -m 15 -w '%{http_code}' -A 'jobvacancy-uptime/1.0' "$URL$1" || echo 000)
              [[ $code =~ $2 ]] && { echo "ok $1 $code"; return 0; }
              [ "$attempt" = 1 ] && sleep 20
            done
            echo "FAIL $1 $code"; fail+=("$1 → HTTP $code")
          }
          probe / '^200$'
          probe /vacancies '^200$'
          probe /api/v1/catalog/regions '^200$'
          host=${URL#https://}; host=${host%%/*}
          end=$(echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          if [ -n "$end" ]; then
            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            echo "certificate: $days days left ($end)"
            [ "$days" -ge 14 ] || fail+=("TLS certificate expires in $days days")
          else
            fail+=("no TLS certificate from $host:443")
          fi
          { echo "failures<<EOF"; printf '%s\n' "${fail[@]}"; echo EOF; } >>"$GITHUB_OUTPUT"
          [ ${#fail[@]} -eq 0 ]
      - name: Telegram
        if: failure() && steps.check.outputs.failures != ''
        env:
          TOKEN: ${{ secrets.UPTIME_TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.UPTIME_TELEGRAM_CHAT_ID }}
          URL: ${{ vars.PUBLIC_URL }}
          FAILURES: ${{ steps.check.outputs.failures }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CHAT" ] || { echo "::warning::UPTIME_TELEGRAM_* secrets not set"; exit 0; }
          text=$(printf '[CRITICAL] External uptime check failed for %s\n%s\n%s' "$URL" "$FAILURES" "$RUN")
          curl -fsS -m 15 "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" --data-urlencode "text=$text" >/dev/null
