name: deploy

# Images → GHCR → staging (automatic) → production (manual approval). TZ OPS-01/02/03/06/08.
#
#   push to main              lint infra, build + push images, deploy to staging (k6 runs
#                             in the background: any 5xx during the roll fails the job)
#   pull request              lint infra, build images (no push); with the "staging" label
#                             (same-repo PRs): push and deploy that PR to staging
#   Run workflow (dispatch)   action=deploy: deploy this commit to staging or production;
#                             action=rollback: the previous release, one step (make rollback).
#                             Production waits for the reviewers of the "production" environment.
#
# Deploy order (nginx/scripts/deploy.sh): backup point → migrate up → api rolling with a
# /readyz gate → web → worker. Images carry version and commit (ldflags / OCI labels).
#
# Repository settings (docs/RUNBOOK.md "CI/CD"):
#   variables: STAGING_HOST, PRODUCTION_HOST, DEPLOY_USER (default deploy), DEPLOY_PATH
#              (default /opt/jobvacancy), VITE_GOOGLE_CLIENT_ID, VITE_SENTRY_DSN,
#              GLITCHTIP_URL (source map upload, reachable from GitHub), STAGING_URL
#              (default https://staging.jobvacancy.uz)
#   secrets:   STAGING_SSH_KEY, STAGING_KNOWN_HOSTS, PRODUCTION_SSH_KEY, PRODUCTION_KNOWN_HOSTS,
#              GLITCHTIP_AUTH_TOKEN (optional), STAGING_BASIC_AUTH ("user:password", optional)
#   environments: staging, production (required reviewers)
# Deploy jobs are skipped while the host variables are empty.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy (or roll back)
        type: choice
        options: [staging, production]
        default: staging
      action:
        description: deploy this commit, or roll back to the previous release
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infra-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose files are valid (prod, staging, dev)
        run: make prod-config
      - name: Shell scripts (shellcheck)
        run: |
          cd nginx
          shellcheck -x -P scripts:postgres/bin -e SC1091 scripts/*.sh bin/* entrypoint.d/*.sh \
            postgres/bin/walg-* postgres/initdb/*.sh ../e2e/seed.sh
          shellcheck -s sh ../monitoring/prometheus/entrypoint.sh ../monitoring/alertmanager/entrypoint.sh
      - name: Monitoring configs (promtool rules + unit tests, amtool, exporters, dashboards)
        run: nginx/scripts/monitoring-lint.sh
      - name: nginx image builds and its config passes nginx -t
        run: make nginx-test
      - name: Postgres image boots with the production config, roles and extensions
        run: |
          docker build -q -t jv-postgres:ci nginx/postgres
          docker run -d --name pg -p 127.0.0.1:5433:5432 -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=jobvacancy \
            -e APP_DB_USER=jobvacancy -e APP_DB_PASSWORD=ci-app -e BACKUP_ENABLED=false jv-postgres:ci \
            postgres -c config_file=/etc/postgresql/postgresql.conf -c shared_buffers=256MB -c effective_cache_size=1GB
          for _ in $(seq 1 60); do docker exec pg pg_isready -q -U postgres -d jobvacancy && break; sleep 1; done
          docker exec pg psql -U postgres -d jobvacancy -XAtc "select name || '=' || setting from pg_settings
            where name in ('random_page_cost','work_mem','max_connections','shared_preload_libraries','archive_mode')"
          docker exec pg psql -U postgres -d jobvacancy -XAtc "select string_agg(extname, ',') from pg_extension"
          docker exec pg psql -U postgres -XAtc "select pg_switch_wal()" >/dev/null && sleep 2
          test "$(docker exec pg psql -U postgres -XAtc 'select failed_count from pg_stat_archiver')" = 0
          docker exec pg wal-g --version
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Migrations run as the non-superuser app role (up, down, up)
        working-directory: backend
        env:
          DATABASE_URL: postgres://jobvacancy:ci-app@127.0.0.1:5433/jobvacancy?sslmode=disable
          JWT_SECRET: ci-secret-0123456789abcdef0123456789abcdef
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate down
          go run ./cmd/migrate up
      - name: Cloudflare ranges in nginx/snippets are current
        run: |
          live=$( (curl -fsS https://www.cloudflare.com/ips-v4; echo; curl -fsS https://www.cloudflare.com/ips-v6) | sed '/^$/d' | sort)
          ours=$(grep -oE '^set_real_ip_from [^;]+' nginx/snippets/cloudflare-real-ip.conf | cut -d' ' -f2 | sort)
          [ "$live" = "$ours" ] || echo "::warning::Cloudflare ranges changed: servers pick them up daily; refresh nginx/snippets/cloudflare-real-ip.conf"

  images:
    needs: infra-lint
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: backend, context: backend, kind: release }
          - { name: web, context: web, kind: release }
          - { name: nginx, context: nginx, kind: nginx }
          - { name: postgres, context: nginx/postgres, kind: postgres }
    outputs:
      tag: ${{ steps.tags.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tags
        name: Tags (release = commit; nginx/postgres = content hash, see nginx/scripts/image-tags.sh)
        run: |
          eval "$(nginx/scripts/image-tags.sh)"
          release="sha-${GITHUB_SHA::12}"
          case "${{ matrix.kind }}" in
            release) tag=$release ;;
            nginx) tag=$NGINX_TAG ;;
            postgres) tag=$POSTGRES_TAG ;;
          esac
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          push=false
          if [ "${{ github.event_name }}" != pull_request ]; then push=true; fi
          if [ "${{ github.event_name }}" = pull_request ] \
            && [ "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY" ] \
            && [ "${{ contains(github.event.pull_request.labels.*.name, 'staging') }}" = true ]; then push=true; fi
          {
            echo "release=$release"
            echo "image=ghcr.io/$owner/jobvacancy-${{ matrix.name }}:$tag"
            echo "date=$(date -u +%FT%TZ)"
            echo "push=$push"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
          build-args: |
            VERSION=${{ steps.tags.outputs.release }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.tags.outputs.date }}
            VITE_SITE_URL=https://jobvacancy.uz
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            GLITCHTIP_URL=${{ steps.tags.outputs.push == 'true' && vars.GLITCHTIP_URL || '' }}
          # web: source maps go to GlitchTip (OPS-05) and are deleted from the image.
          secrets: |
            glitchtip_token=${{ secrets.GLITCHTIP_AUTH_TOKEN }}

  deploy-staging:
    needs: images
    if: >-
      vars.STAGING_HOST != '' && (
        (github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && inputs.action == 'deploy') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'staging')
          && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://staging.jobvacancy.uz' }}
    concurrency: deploy-staging
    env:
      BASE: ${{ vars.STAGING_URL || 'https://staging.jobvacancy.uz' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: k6
      - name: Install k6 v2.3.0 (checksum pinned)
        run: |
          curl -fsSL -o /tmp/k6.tgz https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz
          echo "39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1  /tmp/k6.tgz" | sha256sum -c -
          tar -xzf /tmp/k6.tgz -C /tmp && install -m 755 /tmp/k6-v2.3.0-linux-amd64/k6 /usr/local/bin/k6
      # TZ OPS-06: "deploy davomida 5xx yo'q (k6 fonda ishlab turadi)".
      - name: Background traffic (k6/zero-downtime.js)
        env:
          AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
        run: |
          nohup k6 run --quiet --address 127.0.0.1:6565 -e BASE="$BASE" -e AUTH="$AUTH" -e RATE=10 \
            -e SUMMARY="$RUNNER_TEMP/zero-downtime.json" k6/zero-downtime.js >"$RUNNER_TEMP/k6.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/k6.pid"
          sleep 15   # a baseline before anything restarts
      - name: Deploy over SSH (strict availability probe)
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          HOST: ${{ vars.STAGING_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER || 'deploy' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/jobvacancy' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER_NAME@$HOST" \
            "set -e; cd '$DEPLOY_PATH'; git fetch --quiet --force origin '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/origin/pr/*';
             git checkout --quiet --force '$SHA'; DEPLOY_PROBE_STRICT=1 make deploy-staging TAG='$TAG'"
      - name: Zero-downtime verdict (no 5xx while the deploy rolled)
        if: ${{ !cancelled() }}
        run: |
          sleep 15   # the new release under traffic for a moment
          curl -fsS -X PATCH http://127.0.0.1:6565/v1/status -H 'Content-Type: application/json' \
            -d '{"data":{"type":"status","id":"default","attributes":{"stopped":true}}}' >/dev/null || true
          pid=$(cat "$RUNNER_TEMP/k6.pid"); while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          grep -E 'zero-downtime:|ERRO' "$RUNNER_TEMP/k6.log" | tail -20 || true
          jq -e '.ok' "$RUNNER_TEMP/zero-downtime.json"

  deploy-production:
    needs: images
    if: >-
      vars.PRODUCTION_HOST != '' && github.event_name == 'workflow_dispatch'
      && inputs.environment == 'production' && inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jobvacancy.uz
    concurrency: deploy-production
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          HOST: ${{ vars.PRODUCTION_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER || 'deploy' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/jobvacancy' }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER_NAME@$HOST" \
            "set -e; cd '$DEPLOY_PATH'; git fetch --quiet --force origin; git checkout --quiet --force '$SHA';
             make deploy TAG='$TAG'"

  # One step back (TZ OPS-06): the previous release's images, rolled the same way, no
  # migrations (they are additive). Production still needs the environment's approval.
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://jobvacancy.uz' || (vars.STAGING_URL || 'https://staging.jobvacancy.uz') }}
    concurrency: deploy-${{ inputs.environment }}
    steps:
      - name: make rollback over SSH
        env:
          SSH_KEY: ${{ inputs.environment == 'production' && secrets.PRODUCTION_SSH_KEY || secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ inputs.environment == 'production' && secrets.PRODUCTION_KNOWN_HOSTS || secrets.STAGING_KNOWN_HOSTS }}
          HOST: ${{ inputs.environment == 'production' && vars.PRODUCTION_HOST || vars.STAGING_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER || 'deploy' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/jobvacancy' }}
          TARGET: ${{ inputs.environment == 'production' && 'rollback' || 'rollback-staging' }}
        run: |
          [ -n "$HOST" ] || { echo "::error::no host variable for ${{ inputs.environment }}"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER_NAME@$HOST" \
            "set -e; cd '$DEPLOY_PATH'; tail -3 nginx/.deploy/${{ inputs.environment }}/history; make $TARGET"
