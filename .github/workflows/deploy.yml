# Push to main → test → build images to GHCR → deploy to the shared host (2.29.150.64).
# The host's Caddy serves jobvacancy.uz; scripts/deploy.sh only touches jobvacancy's own
# api/worker/web containers and rolls back if the new version isn't healthy.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'deploy/**'
      - 'scripts/deploy.sh'
      - 'nginx/docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/backend.yml'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend:
    uses: ./.github/workflows/backend.yml
  web:
    uses: ./.github/workflows/web.yml

  api-image:
    needs: [backend, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Compiled here, where setup-go caches modules and the build cache; Dockerfile.ci only
      # copies the binaries (a full in-Docker compile took ~20 minutes).
      - name: Build binaries
        working-directory: backend
        env:
          CGO_ENABLED: "0"
        run: for c in api worker migrate ctl; do go build -trimpath -ldflags="-s -w" -o dist/$c ./cmd/$c; done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.ci
          push: true
          tags: |
            ghcr.io/setdarovdev/jobvacancy-api:${{ github.sha }}
            ghcr.io/setdarovdev/jobvacancy-api:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  web-image:
    needs: [backend, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/setdarovdev/jobvacancy-web:${{ github.sha }}
            ghcr.io/setdarovdev/jobvacancy-web:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=jobvacancy-web
          cache-to: type=gha,mode=max,scope=jobvacancy-web

  deploy:
    needs: [api-image, web-image]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Copy deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Only into directories owned by jobvacancy-deploy; nginx/ belongs to another user, and
          # the prod compose file there is used as-is (the server override picks the services).
          source: deploy/docker-compose.server.yml,scripts/deploy.sh
          target: /opt/jobvacancy
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 20m
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            bash /opt/jobvacancy/scripts/deploy.sh "$TAG"
            docker logout ghcr.io
