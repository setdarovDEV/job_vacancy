name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "backend/api/openapi.yaml", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "backend/api/openapi.yaml", ".github/workflows/web.yml"]

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.33.0 }   # same pnpm as web/Dockerfile and local development
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types match openapi.yaml
        run: pnpm api:types && git diff --exit-code app/shared/api/schema.d.ts
      - run: pnpm typecheck
      - name: Every t() key exists in all 4 languages
        run: node --experimental-strip-types --no-warnings test/i18n-keys.mjs | tee /dev/stderr | grep -q "all keys present"
      - run: pnpm build
        env: { NODE_ENV: production }
      - name: Core bundle budget (react, router, root, CSS ≤ 120 KB gzip)
        run: |
          total=0
          for f in build/client/assets/entry.client-*.js build/client/assets/root-*.{js,css} build/client/assets/components-*.js; do
            total=$((total + $(gzip -9c "$f" | wc -c)))
          done
          echo "core bundle: $total bytes gzip"
          test "$total" -le 120000
