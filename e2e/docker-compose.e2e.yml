# Whole-stack browser tests (TZ QA-02): the production images of the API, worker and web,
# Postgres 18, Redis, MinIO and Mailpit, behind a small HTTP gateway that routes like the
# production nginx (/ → web SSR, /api → api). CI: .github/workflows/e2e.yml.
#
#   make e2e-up          # build (or reuse jobvacancy-*:e2e) and start, migrations included
#   make e2e-seed        # demo accounts + published vacancies (e2e/seed.sh)
#   make e2e-a11y        # axe light/dark × 4 locales (e2e/a11y.mjs)
#   make e2e-down        # stop and delete everything (volumes too)
#
# Ports on 127.0.0.1: gateway 8080 (the site), API 8090 and Mailpit 8025 (seed scripts and
# web/test/*.mjs use them), MinIO 9200 (presigned URLs from the browser).
name: jobvacancy-e2e

x-backend-env: &backend-env
  APP_ENV: development          # dev e2e reads verification codes from Mailpit
  WEB_URL: http://localhost:8080
  HTTP_ADDR: ":8090"
  HTTP_CORS_ORIGINS: http://localhost:8080,http://localhost:5180
  METRICS_ADDR: ":9091"
  WORKER_METRICS_ADDR: ":9092"
  DATABASE_URL: postgres://jobvacancy:jobvacancy@postgres:5432/jobvacancy?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: e2e-only-secret-0123456789abcdef0123456789abcdef
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_TLS: none
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: jobvacancy
  S3_SECRET_KEY: jobvacancy-secret
  S3_PUBLIC_ENDPOINT: localhost:9200
  S3_PUBLIC_BASE_URL: http://localhost:9200/jv-public
  SEARCH_POPULAR_MIN_IPS: "1"
  LOG_LEVEL: info
  LOG_FORMAT: json

x-backend: &backend
  image: ${E2E_BACKEND_IMAGE:-jobvacancy-backend:e2e}
  build:
    context: ../backend
    args: { VERSION: e2e, COMMIT: "${GITHUB_SHA:-local}" }
  environment: *backend-env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_healthy }
    mailpit: { condition: service_started }

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: jobvacancy
      POSTGRES_PASSWORD: jobvacancy
      POSTGRES_DB: jobvacancy
    command: ["postgres", "-c", "random_page_cost=1.1", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    tmpfs: ["/var/lib/postgresql:size=1g"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobvacancy -d jobvacancy"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.2-alpine@sha256:72cedd9603038893af961e90ac5e1a1a0d8377d5e338dbdad8fe284ea25de18f
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: jobvacancy
      MINIO_ROOT_PASSWORD: jobvacancy-secret
      MINIO_UPDATE: "off"
    ports: ["127.0.0.1:9200:9000"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["127.0.0.1:8025:8025"]

  migrate:
    <<: *backend
    command: ["/app/migrate", "up"]
    healthcheck: { disable: true }
    restart: "no"

  api:
    <<: *backend
    command: ["/app/api"]
    ports: ["127.0.0.1:8090:8090"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    <<: *backend
    command: ["/app/worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/app/worker", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 30

  # ctl for the seed script (set-role): docker compose run --rm ctl set-role ...
  ctl:
    <<: *backend
    entrypoint: ["/app/ctl"]
    command: []
    profiles: [tools]
    healthcheck: { disable: true }
    restart: "no"

  web:
    image: ${E2E_WEB_IMAGE:-jobvacancy-web:e2e}
    build:
      context: ../web
      args: { VERSION: e2e, VITE_SITE_URL: "http://localhost:8080" }
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      API_URL: http://api:8090/api/v1
    depends_on:
      api: { condition: service_healthy }

  # The production nginx needs TLS and the real host names; this gateway only routes.
  gateway:
    image: nginx:1.30.5-alpine@sha256:bf3201ab56f23e5954646379c775d511fc466e9f11376d9725361064ad07ed35
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/catalog/regions >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
