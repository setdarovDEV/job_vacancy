name: jobvacancy
description: "Job Vacancy (jobvacancy.uz) mobile app for job seekers."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  dio: ^5.11.1
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.5
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  build_runner: ^2.5.4
  mocktail: ^1.0.5



flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/Unbounded-OFL.txt
    - assets/fonts/Onest-OFL.txt
  fonts:
    # Variable fonts; weights are applied through the wght axis (see core/theme).
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Variable.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
