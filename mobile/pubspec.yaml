name: jobvacancy
description: "Job Vacancy (jobvacancy.uz) mobile app for job seekers."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  dio: ^5.11.1
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.5
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.7+1
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  web_socket_channel: ^3.0.2
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  mime: ^2.0.0
  uuid: ^4.4.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  record: ^6.2.1
  audioplayers: ^6.7.1
  geolocator: ^14.0.2
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  build_runner: ^2.5.4
  mocktail: ^1.0.5



flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/Unbounded-OFL.txt
    - assets/fonts/Onest-OFL.txt
  fonts:
    # Variable fonts; weights are applied through the wght axis (see core/theme).
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Variable.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
