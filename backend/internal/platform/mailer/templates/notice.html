<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{.Title}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c1b29;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:32px 16px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;overflow:hidden;">
      <tr><td style="background:#1b3a8c;padding:20px 32px;">
        <span style="font-size:18px;font-weight:700;color:#ffffff;letter-spacing:-0.2px;">Job Vacancy</span>
      </td></tr>
      <tr><td style="padding:32px;">
        <h1 style="margin:0 0 12px;font-size:21px;line-height:1.35;font-weight:700;">{{.Title}}</h1>
        <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#4a4960;white-space:pre-line;">{{.Body}}</p>
        {{if .URL}}<a href="{{.URL}}" style="display:inline-block;background:#1b3a8c;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 22px;border-radius:10px;">{{.Button}}</a>{{end}}
      </td></tr>
      <tr><td style="padding:16px 32px;border-top:1px solid #ececf2;font-size:12px;line-height:1.5;color:#8a89a0;">
        {{.Footer}}
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
