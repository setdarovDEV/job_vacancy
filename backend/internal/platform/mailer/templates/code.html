<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{.Title}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c1b29;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:32px 16px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;overflow:hidden;">
      <tr><td style="background:#1b3a8c;padding:20px 32px;">
        <span style="font-size:18px;font-weight:700;color:#ffffff;letter-spacing:-0.2px;">Job Vacancy</span>
      </td></tr>
      <tr><td style="padding:32px;">
        <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:700;">{{.Title}}</h1>
        <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#4a4960;">{{.Intro}}</p>
        <div style="background:#e7edfb;border-radius:12px;padding:18px;text-align:center;font-size:32px;font-weight:700;letter-spacing:10px;color:#1b3a8c;font-family:'SFMono-Regular',Consolas,monospace;">{{.Code}}</div>
        <p style="margin:24px 0 8px;font-size:14px;line-height:1.6;color:#4a4960;">{{.Expires}}</p>
        <p style="margin:0;font-size:13px;line-height:1.6;color:#8a89a0;">{{.Ignore}}</p>
      </td></tr>
      <tr><td style="padding:16px 32px;border-top:1px solid #ececf2;font-size:12px;color:#8a89a0;">
        jobvacancy.uz
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
