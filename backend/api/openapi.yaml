openapi: 3.1.0
info:
  title: Job Vacancy API
  version: 0.5.0
  description: |
    Shared contract for the web (React) and mobile (Flutter) clients.

    **Realtime.** POST /ws/ticket, then open `wss://…/api/v1/ws?ticket=…`. Server events:
    `ready`, `message.new`, `message.read`, `message.deleted`, `typing`, `presence`,
    `presence.snapshot`, `notification.new`, `pong`, `error` — each `{"type", "data"}`.
    Client frames: `{"type":"ping"}`, `{"type":"typing","conversation_id"}`,
    `{"type":"read","conversation_id","message_id"}`, `{"type":"watch_presence","user_ids":[…]}`.
    Events are not buffered: after reconnecting, fetch `/conversations/{id}/messages?after=<last id>`.

    **Uploads.** POST /files → multipart POST to `upload.url` with every `upload.fields`
    entry followed by the `file` field → POST /files/{id}/complete → use the file id.

    **Envelope.** Success: `{"data": ...}` (lists add `"meta"`). Failure:
    `{"error": {"code", "message", "fields"?, "retry_after"?}}`. `code` is stable; clients
    translate it into uz / uz-Cyrl / ru / en. `fields` maps a JSON field to the failing
    rule (`required`, `email`, `min=8`, `max=50`, `password`, `oneof=...`, `boolean`,
    `integer`, `unique`). Rules that aren't about the value's form: `invalid` (nothing
    usable is left after normalising, e.g. a skill name of only punctuation), `not_found`
    (an id given in the body doesn't exist, e.g. a merge target; ids in the path answer
    404 instead) and `not_self` (an action can't target the resource itself).

    **Tokens.** The access token (JWT, 15 min) goes in `Authorization: Bearer`.
    Web: the refresh token lives in the HttpOnly cookie `jv_refresh` (path `/api/v1/auth`).
    Mobile: send `X-Client-Type: android|ios`; the refresh token is returned in and read
    from the JSON body. Refresh tokens rotate on every use.

    **Verbs for state.** A flag that can be set and cleared idempotently is a sub-resource:
    `PUT` sets it, `DELETE` clears it (company verification and block, user block, skill
    verification, saved vacancies); setting it on many at once is a `POST` to the
    collection's flag (`/admin/skills/verification`). Editing a resource's fields is
    `PATCH` (skill rename). A one-way step in a workflow is a `POST` action that may answer
    409 `invalid_status_transition` (vacancy submit / approve / reject / takedown / archive,
    resolving or dismissing reports, merging skills).
servers:
  - url: https://jobvacancy.uz/api/v1
  - url: http://localhost:8090/api/v1

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    VacancyRef: { name: vacancy, in: path, required: true, schema: { type: string }, description: "uuid (writes) or slug (reads)" }
    ResumeRef: { name: resume, in: path, required: true, schema: { type: string, format: uuid } }
    ApplicationRef: { name: application, in: path, required: true, schema: { type: string, format: uuid } }
    CompanyRef: { name: company, in: path, required: true, schema: { type: string }, description: uuid or slug }
    UserRef: { name: user, in: path, required: true, schema: { type: string, format: uuid }, description: "user id; a malformed id answers 404 user_not_found like an unknown one" }
    AdminLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 }, description: page size for every admin list }
    SkillRef: { name: skill, in: path, required: true, schema: { type: integer, minimum: 1 }, description: "skill id; a malformed id answers 404 skill_not_found like an unknown one" }
    ReportTargetType: { name: target_type, in: path, required: true, schema: { type: string, enum: [vacancy, company] } }
    ReportTargetId: { name: target_id, in: path, required: true, schema: { type: string, format: uuid }, description: "vacancy or company id; anything malformed answers 404 reported_target_not_found" }
    StatsDays: { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 30 }, description: "period length in calendar days (Asia/Tashkent), ending today and including it; anything else answers 422 fields.days" }
    ClientType:
      name: X-Client-Type
      in: header
      schema: { type: string, enum: [web, android, ios], default: web }
  schemas:
    Locale: { type: string, enum: [uz, uz-Cyrl, ru, en] }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [invalid_credentials] }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
            retry_after: { type: integer, description: seconds }
    User:
      type: object
      required: [id, email, email_verified, phone, phone_verified, full_name, avatar_url, role, locale, has_password, google_linked, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, "null"], format: email }
        email_verified: { type: boolean }
        phone: { type: [string, "null"], examples: ["+998901234567"] }
        phone_verified: { type: boolean }
        full_name: { type: string }
        avatar_url: { type: [string, "null"] }
        role: { type: string, enum: [seeker, employer, admin] }
        locale: { $ref: "#/components/schemas/Locale" }
        has_password: { type: boolean }
        google_linked: { type: boolean }
        created_at: { type: string, format: date-time }
    Auth:
      type: object
      properties:
        data:
          type: object
          properties:
            user: { $ref: "#/components/schemas/User" }
            access_token: { type: string }
            access_token_expires_at: { type: string, format: date-time }
            refresh_token: { type: string, description: mobile clients only }
            refresh_token_expires_at: { type: string, format: date-time, description: mobile clients only }
            is_new_user: { type: boolean }
    UserResponse:
      type: object
      properties: { data: { $ref: "#/components/schemas/User" } }
    Session:
      type: object
      required: [id, platform, user_agent, created_at, last_used_at, current]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [web, android, ios] }
        user_agent: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        current: { type: boolean }
    Code:
      type: object
      required: [code]
      properties: { code: { type: string, pattern: "^[0-9]{6}$" } }
    Names:
      type: object
      required: [uz, uz-Cyrl, ru, en]
      description: Localized names; clients pick by UI language.
      properties: { uz: { type: string }, uz-Cyrl: { type: string }, ru: { type: string }, en: { type: string } }
    Category:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { $ref: "#/components/schemas/Names" }
        icon: { type: string, description: lucide icon name }
        children: { type: array, items: { $ref: "#/components/schemas/Category" } }
    Region:
      type: object
      required: [id, slug, kind, name]
      properties:
        id: { type: integer }
        slug: { type: string }
        kind: { type: string, enum: [region, city, district] }
        name: { $ref: "#/components/schemas/Names" }
        children: { type: array, items: { $ref: "#/components/schemas/Region" } }
    Skill:
      type: object
      required: [id, name]
      properties: { id: { type: integer }, name: { type: string } }
    CompanyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        industry_id: { type: integer, description: category id }
        size: { type: string, enum: ["1-10", "11-50", "51-200", "201-500", "501-1000", "1000+"] }
        website: { type: string, description: "scheme optional: najottalim.uz → https://najottalim.uz" }
        email: { type: string, format: email }
        phone: { type: string }
        region_id: { type: integer, description: top-level region }
        address: { type: string, maxLength: 300 }
        about: { type: string, maxLength: 5000 }
        founded_year: { type: integer, minimum: 1800, maximum: 2100 }
    Company:
      allOf:
        - $ref: "#/components/schemas/CompanyInput"
        - type: object
          required: [id, slug, name, logo_url, cover_url, verified, created_at, about]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            logo_url: { type: [string, "null"] }
            cover_url: { type: [string, "null"] }
            verified: { type: boolean }
            created_at: { type: string, format: date-time }
            open_vacancies: { type: integer, description: public profile only }
            my_role: { type: string, enum: [owner, admin, recruiter], description: "/me/companies only" }
    PeriodTotal:
      type: object
      required: [current, previous]
      description: Count for the period and for the same number of days just before it (for ↑/↓ comparisons).
      properties: { current: { type: integer }, previous: { type: integer } }
    StatsWindow:
      type: object
      required: [days, from, to]
      description: The period a statistics response covers.
      properties:
        days: { type: integer, enum: [7, 30, 90] }
        from: { type: string, format: date, description: first day (Asia/Tashkent) }
        to: { type: string, format: date, description: today (Asia/Tashkent) }
    AdminActivity:
      type: object
      description: >
        Daily activity, one bucket per calendar day (Asia/Tashkent) of the period, oldest
        first, zero-filled. Signups exclude deleted accounts and admins; vacancies count by
        publication date whatever their status now; applications count only those sent by
        seekers (not employer invitations). Signups are split by the account's current
        role (an account that changed role counts under its role now). Cached for up to
        5 minutes.
      required: [period, daily, totals]
      properties:
        period: { $ref: "#/components/schemas/StatsWindow" }
        daily:
          type: array
          items:
            type: object
            required: [date, signups_seeker, signups_employer, vacancies_published, applications_sent, reports_filed]
            properties:
              date: { type: string, format: date }
              signups_seeker: { type: integer }
              signups_employer: { type: integer }
              vacancies_published: { type: integer }
              applications_sent: { type: integer }
              reports_filed: { type: integer }
        totals:
          type: object
          required: [signups_seeker, signups_employer, vacancies_published, applications_sent, reports_filed]
          properties:
            signups_seeker: { $ref: "#/components/schemas/PeriodTotal" }
            signups_employer: { $ref: "#/components/schemas/PeriodTotal" }
            vacancies_published: { $ref: "#/components/schemas/PeriodTotal" }
            applications_sent: { $ref: "#/components/schemas/PeriodTotal" }
            reports_filed: { $ref: "#/components/schemas/PeriodTotal" }
    RankedCatalogItem:
      type: object
      required: [id, slug, name, vacancies_published]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { $ref: "#/components/schemas/Names" }
        vacancies_published: { type: integer, description: vacancies published in the period }
    AdminBreakdown:
      type: object
      description: Where the period's activity went. Cached for up to 5 minutes.
      required: [period, top_categories, top_regions, funnel]
      properties:
        period: { $ref: "#/components/schemas/StatsWindow" }
        top_categories:
          type: array
          maxItems: 8
          description: Top-level categories (a vacancy's subcategory counts toward its parent), most vacancies first.
          items: { $ref: "#/components/schemas/RankedCatalogItem" }
        top_regions:
          type: array
          maxItems: 8
          description: Regions (viloyat / Tashkent city), most vacancies first.
          items: { $ref: "#/components/schemas/RankedCatalogItem" }
        funnel:
          type: object
          description: >
            Applications seekers sent in the period and how many ever reached each later
            stage (history counts, so one later rejected still counts as invited).
            viewed = the employer opened it or moved it to invited/interview/hired;
            invited = ever invited, at interview or hired; hired = ever hired.
          required: [sent, viewed, invited, hired]
          properties: { sent: { type: integer }, viewed: { type: integer }, invited: { type: integer }, hired: { type: integer } }
    AdminStats:
      type: object
      description: >
        Overview counters. Deleted accounts are excluded from every user counter. The
        *_last_7d counters use the same window and rules as AdminActivity for days = 7
        (7 calendar days in Asia/Tashkent ending today; signups are seekers and employers,
        applications are the ones seekers sent), so they match its current totals.
      required: [users, companies, vacancies, applications, reports, skills]
      properties:
        users:
          type: object
          required: [total, signed_up_last_7d, blocked]
          properties:
            total: { type: integer, description: active + blocked accounts (admins included) }
            signed_up_last_7d: { type: integer, description: "seekers + employers; = AdminActivity(days=7) signups_seeker + signups_employer current" }
            blocked: { type: integer }
        companies:
          type: object
          required: [total, active_unverified, blocked]
          properties:
            total: { type: integer }
            active_unverified: { type: integer, description: not blocked and not verified (their vacancies go through moderation) }
            blocked: { type: integer }
        vacancies:
          type: object
          required: [live, pending_moderation]
          properties:
            live: { type: integer, description: published right now (not the same as AdminActivity vacancies_published, which counts publications in a period) }
            pending_moderation: { type: integer }
        applications:
          type: object
          required: [sent_last_7d]
          properties:
            sent_last_7d: { type: integer, description: "sent by seekers (not employer invitations); = AdminActivity(days=7) applications_sent current" }
        reports:
          type: object
          required: [open_targets]
          properties:
            open_targets: { type: integer, description: vacancies and companies with at least one open report }
        skills:
          type: object
          required: [unverified]
          properties:
            unverified: { type: integer, description: user-added skills nobody has reviewed yet (not offered in autocomplete) }
    Notification:
      type: object
      description: >
        In-app notification. `payload` carries what the type needs:
        application.new (application_id, vacancy_title, candidate_name);
        application.status (application_id, vacancy_title, company_name, status);
        application.invited (application_id, vacancy_title, company_name);
        vacancy.approved (vacancy_id, vacancy_title);
        vacancy.rejected and vacancy.taken_down (vacancy_id, vacancy_title, reason);
        search.alert (search_id, search_name, count, preview);
        report.resolved and report.dismissed (target_type, target_name).
      required: [id, type, payload, read_at, created_at]
      properties:
        id: { type: integer }
        type:
          type: string
          enum: [application.new, application.status, application.invited, vacancy.approved, vacancy.rejected,
                 vacancy.taken_down, search.alert, report.resolved, report.dismissed]
        payload:
          type: object
          properties:
            application_id: { type: string, format: uuid }
            vacancy_id: { type: string, format: uuid }
            vacancy_title: { type: string }
            company_name: { type: string }
            candidate_name: { type: string }
            status: { type: string }
            reason: { type: string, description: "vacancy.rejected / vacancy.taken_down: shown to the employer" }
            search_id: { type: string }
            search_name: { type: string }
            count: { type: integer }
            preview: { type: string }
            target_type: { type: string, enum: [vacancy, company], description: "report.*: what was reported" }
            target_name: { type: string, description: "report.*: the vacancy title or company name" }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    ReportReason:
      type: string
      enum: [fraud, misleading, offensive, spam, other]
      description: "fraud: scam or asks for money; misleading: false information; offensive: abusive or illegal content; spam: spam or duplicate; other: needs a comment"
    Report:
      type: object
      required: [id, target_type, target_id, reason, comment, status, created_at]
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string, enum: [vacancy, company] }
        target_id: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ReportReason" }
        comment: { type: [string, "null"] }
        status: { type: string, enum: [open, resolved, dismissed] }
        created_at: { type: string, format: date-time }
    ReportedTarget:
      type: object
      description: >
        One row of the admin report queue: a target and its reports in `status`. Exactly one
        of vacancy / company is set, matching target_type. status_report_count, `reasons` and
        `latest` cover the reports in `status`; total_report_count covers every report ever
        filed on the target. `public` says whether anyone can see the target right now.
      required: [target_type, target_id, status, vacancy, company, status_report_count, total_report_count, reasons, latest,
                 first_reported_at, last_reported_at, last_activity_at]
      properties:
        target_type: { type: string, enum: [vacancy, company] }
        target_id: { type: string, format: uuid }
        status: { type: string, enum: [open, resolved, dismissed] }
        vacancy:
          oneOf:
            - type: "null"
            - type: object
              required: [id, title, slug, status, public, company]
              properties:
                id: { type: string, format: uuid }
                title: { type: string }
                slug: { type: string }
                status: { type: string, enum: [draft, moderation, published, rejected, archived, expired] }
                public: { type: boolean, description: published and its company is active }
                company:
                  type: object
                  required: [id, name, slug, status]
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    slug: { type: string }
                    status: { type: string, enum: [active, blocked] }
        company:
          oneOf:
            - type: "null"
            - type: object
              required: [id, name, slug, logo_url, status, public, verified]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                slug: { type: string }
                logo_url: { type: [string, "null"] }
                status: { type: string, enum: [active, blocked] }
                public: { type: boolean, description: the company is active }
                verified: { type: boolean }
        status_report_count: { type: integer }
        total_report_count: { type: integer }
        reasons:
          type: object
          description: one counter per reason, always all of them
          required: [fraud, misleading, offensive, spam, other]
          properties:
            fraud: { type: integer }
            misleading: { type: integer }
            offensive: { type: integer }
            spam: { type: integer }
            other: { type: integer }
        latest:
          type: array
          description: the newest three reports, newest first
          items:
            type: object
            required: [id, reason, comment, reporter_name, created_at]
            properties:
              id: { type: string, format: uuid }
              reason: { $ref: "#/components/schemas/ReportReason" }
              comment: { type: [string, "null"] }
              reporter_name: { type: string }
              created_at: { type: string, format: date-time }
        first_reported_at: { type: string, format: date-time }
        last_reported_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time, description: "newest report, or when the reports were closed" }
    AdminCompany:
      description: The same complete shape in lists and in mutation responses.
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          required: [status, owner_name, owner_email, open_vacancies]
          properties:
            status: { type: string, enum: [active, blocked] }
            owner_name: { type: string }
            owner_email: { type: [string, "null"] }
            open_vacancies: { type: integer }
    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [status, last_seen_at]
          properties:
            status: { type: string, enum: [active, blocked] }
            last_seen_at: { type: [string, "null"], format: date-time }
    AdminSkill:
      type: object
      description: A skill as admins see it. The same complete shape in lists and in mutation responses.
      required: [id, name, slug, verified, popularity, vacancy_count, resume_count, in_use, aliases, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        verified: { type: boolean, description: reviewed by an admin; only verified skills are suggested in autocomplete }
        popularity: { type: integer, description: "autocomplete ranking: grows each time a vacancy listing the skill is published and never shrinks (not the same as in_use)" }
        vacancy_count: { type: integer, description: vacancies that list this skill now }
        resume_count: { type: integer, description: resumes that list this skill now }
        in_use: { type: integer, description: vacancy_count + resume_count }
        aliases:
          type: array
          items: { type: string }
          description: slugs of names merged or renamed into this skill; typing those names resolves to it
        created_at: { type: string, format: date-time }
    PageMeta:
      type: object
      required: [next_cursor]
      properties:
        next_cursor: { type: [string, "null"], description: "pass as ?cursor= for the next page; null on the last page" }
    CompanySummary:
      type: object
      required: [id, name, slug, logo_url, verified]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: [string, "null"] }
        verified: { type: boolean }
    VacancyInput:
      type: object
      required: [title, description, category_id, region_id, employment_type, work_format, experience, schedule]
      properties:
        title: { type: string, minLength: 3, maxLength: 150 }
        description: { type: string, minLength: 30, maxLength: 10000, description: Markdown }
        category_id: { type: integer }
        region_id: { type: integer, description: top-level region }
        district_id: { type: integer, description: must belong to region_id }
        address: { type: string, maxLength: 300 }
        salary_min: { type: integer, format: int64 }
        salary_max: { type: integer, format: int64 }
        currency: { type: string, enum: [UZS, USD], default: UZS }
        employment_type: { $ref: "#/components/schemas/EmploymentType" }
        work_format: { $ref: "#/components/schemas/WorkFormat" }
        experience: { $ref: "#/components/schemas/Experience" }
        schedule: { $ref: "#/components/schemas/Schedule" }
        skills: { type: array, maxItems: 20, items: { type: string, maxLength: 50 }, description: "free-text names; unknown ones are created; a too-long one fails as fields.skills[i]" }
    EmploymentType: { type: string, enum: [full_time, part_time, project, internship, volunteer] }
    WorkFormat: { type: string, enum: [office, remote, hybrid] }
    Experience: { type: string, enum: [none, 1_3, 3_6, 6_plus] }
    Schedule: { type: string, enum: [full_day, shift, flexible, rotation] }
    VacancyStatus: { type: string, enum: [draft, moderation, published, rejected, archived, expired] }
    VacancyCard:
      type: object
      required: [id, slug, title, company, category_id, region_id, district_id, salary, employment_type, work_format, experience, schedule, skills, is_featured, status, views_count, applications_count, published_at, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        company: { $ref: "#/components/schemas/CompanySummary" }
        category_id: { type: integer }
        region_id: { type: integer }
        district_id: { type: [integer, "null"] }
        salary:
          type: [object, "null"]
          properties: { min: { type: [integer, "null"] }, max: { type: [integer, "null"] }, currency: { type: string } }
        employment_type: { $ref: "#/components/schemas/EmploymentType" }
        work_format: { $ref: "#/components/schemas/WorkFormat" }
        experience: { $ref: "#/components/schemas/Experience" }
        schedule: { $ref: "#/components/schemas/Schedule" }
        skills: { type: array, items: { $ref: "#/components/schemas/Skill" } }
        is_featured: { type: boolean }
        status: { $ref: "#/components/schemas/VacancyStatus" }
        views_count: { type: integer, description: updated about once a minute }
        applications_count: { type: integer }
        published_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    VacancyDetail:
      allOf:
        - $ref: "#/components/schemas/VacancyCard"
        - type: object
          required: [description, address, updated_at, can_edit]
          properties:
            description: { type: string }
            address: { type: [string, "null"] }
            updated_at: { type: string, format: date-time }
            can_edit: { type: boolean }
            reject_reason: { type: string, description: company members only }
            submitted_at: { type: string, format: date-time, description: company members only }
    VacancyResponse:
      type: object
      required: [data]
      properties: { data: { $ref: "#/components/schemas/VacancyDetail" } }
    VacancyPage:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/VacancyCard" } }
        meta:
          type: object
          properties:
            next_cursor: { type: [string, "null"], description: "pass as ?cursor= for the next page" }
            total: { type: integer, description: "first page of /vacancies only; capped at 1000" }
            total_capped: { type: boolean, description: "true → show \"1000+\"" }
            fuzzy: { type: boolean, description: results are typo-tolerant matches }
    ResumeInput:
      type: object
      required: [title]
      description: The whole resume; PUT replaces every section.
      properties:
        title: { type: string, minLength: 2, maxLength: 150, description: desired position }
        about: { type: string, maxLength: 5000 }
        category_id: { type: integer }
        region_id: { type: integer }
        relocate: { type: boolean }
        desired_salary: { type: integer, format: int64 }
        currency: { type: string, enum: [UZS, USD] }
        employment_types: { type: array, items: { $ref: "#/components/schemas/EmploymentType" } }
        work_formats: { type: array, items: { $ref: "#/components/schemas/WorkFormat" } }
        visibility: { $ref: "#/components/schemas/ResumeVisibility" }
        experiences: { type: array, maxItems: 20, description: most recent first, items: { $ref: "#/components/schemas/ResumeExperience" } }
        educations: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/ResumeEducation" } }
        skills: { type: array, maxItems: 30, items: { type: string, maxLength: 50 }, description: "free-text names; a too-long one fails as fields.skills[i]" }
        languages: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/ResumeLanguage" } }
    ResumeExperience:
      type: object
      required: [company, position, start]
      properties:
        company: { type: string }
        position: { type: string }
        start: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$", examples: ["2021-06"] }
        end: { type: [string, "null"], description: "null = current job" }
        description: { type: string, maxLength: 3000 }
    ResumeEducation:
      type: object
      required: [institution, level]
      properties:
        institution: { type: string }
        level: { type: string, enum: [secondary, vocational, incomplete_higher, bachelor, master, phd] }
        field: { type: string }
        start_year: { type: integer }
        end_year: { type: integer }
    ResumeLanguage:
      type: object
      required: [language, level]
      properties:
        language: { type: string, description: "ISO 639 code: uz, ru, en…" }
        level: { type: string, enum: [a1, a2, b1, b2, c1, c2, native] }
    ResumeVisibility:
      type: string
      enum: [public, applied_only, hidden]
      description: "public: in candidate search · applied_only: only companies you applied to · hidden: only you (and companies you send it to)"
    ResumeCard:
      type: object
      required: [id, title, person, category_id, region_id, relocate, experience_months, desired_salary, last_job, skills, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        person: { type: object, properties: { id: { type: string, format: uuid }, full_name: { type: string }, avatar_url: { type: [string, "null"] } } }
        category_id: { type: [integer, "null"] }
        region_id: { type: [integer, "null"] }
        relocate: { type: boolean }
        experience_months: { type: integer, description: overlapping jobs counted once }
        desired_salary: { type: [object, "null"], properties: { amount: { type: integer }, currency: { type: string } } }
        last_job: { type: [object, "null"], properties: { position: { type: string }, company: { type: string }, current: { type: boolean } } }
        skills: { type: array, items: { $ref: "#/components/schemas/Skill" } }
        visibility: { $ref: "#/components/schemas/ResumeVisibility" }
        updated_at: { type: string, format: date-time }
    ResumeDetail:
      allOf:
        - $ref: "#/components/schemas/ResumeCard"
        - type: object
          properties:
            about: { type: string }
            employment_types: { type: array, items: { type: string } }
            work_formats: { type: array, items: { type: string } }
            experiences: { type: array, items: { $ref: "#/components/schemas/ResumeExperience" } }
            educations: { type: array, items: { $ref: "#/components/schemas/ResumeEducation" } }
            languages: { type: array, items: { $ref: "#/components/schemas/ResumeLanguage" } }
            contacts:
              type: [object, "null"]
              description: owner, admins, and companies the seeker applied to / was invited by
              properties: { email: { type: [string, "null"] }, phone: { type: [string, "null"] } }
            is_owner: { type: boolean }
    ApplicationStatus: { type: string, enum: [sent, viewed, invited, interview, hired, rejected, withdrawn] }
    Application:
      type: object
      properties:
        id: { type: string, format: uuid }
        vacancy_id: { type: string, format: uuid }
        resume_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        source: { type: string, enum: [apply, invite] }
        cover_letter: { type: string }
        viewed_at: { type: [string, "null"], format: date-time }
        status_changed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        vacancy: { $ref: "#/components/schemas/VacancyCard" }
        candidate: { type: object, description: employer only }
        employer_note: { type: string, description: employer only }
        events:
          type: array
          items:
            type: object
            properties:
              from: { type: [string, "null"] }
              to: { type: string }
              note: { type: string, description: "employer: always; seeker: only the invitation message" }
              at: { type: string, format: date-time }
    ApplicationResponse:
      type: object
      properties: { data: { $ref: "#/components/schemas/Application" } }
    ResumeResponse:
      type: object
      properties: { data: { $ref: "#/components/schemas/ResumeDetail" } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Auth:
      description: Signed in
      content: { application/json: { schema: { $ref: "#/components/schemas/Auth" } } }
    User:
      description: Current user
      content: { application/json: { schema: { $ref: "#/components/schemas/UserResponse" } } }
    NoContent: { description: Done }
    Resume:
      description: Resume
      content: { application/json: { schema: { $ref: "#/components/schemas/ResumeResponse" } } }
    Application:
      description: Application
      content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationResponse" } } }
    Vacancy:
      description: Vacancy
      content: { application/json: { schema: { $ref: "#/components/schemas/VacancyResponse" } } }
    VacancyPage:
      description: Page of vacancies
      content: { application/json: { schema: { $ref: "#/components/schemas/VacancyPage" } } }
    Company:
      description: Company
      content:
        application/json:
          schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Company" } } }
    Unauthorized:
      description: Missing, invalid, expired or revoked access token (unauthorized)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    AdminOnly:
      description: Signed in but not an admin (forbidden)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InvalidCursor:
      description: cursor is not one this API issued (invalid_cursor)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CompanyNotFound:
      description: No company with that id or slug (company_not_found)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UserNotFound:
      description: No such user, or a malformed id (user_not_found)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SkillNotFound:
      description: No such skill, or a malformed id (skill_not_found)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ReportTargetNotFound:
      description: Not a public vacancy or company, or no reports for it (report_target_not_found)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ReportedTargetNotFound:
      description: No reports were ever filed on that target, it no longer exists, or the path is malformed (reported_target_not_found)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ReportedTarget:
      description: The target as the queue now shows it
      content:
        application/json:
          schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ReportedTarget" } } }
    AdminCompany:
      description: Company with moderation state
      content:
        application/json:
          schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AdminCompany" } } }
    AdminSkill:
      description: Skill with usage and aliases
      content:
        application/json:
          schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AdminSkill" } } }
    AdminUser:
      description: User with account state
      content:
        application/json:
          schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AdminUser" } } }

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Sign up with email and password (sends a verification code by email)
      parameters: [{ $ref: "#/components/parameters/ClientType" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name, role]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72, description: at least one letter and one digit }
                full_name: { type: string, minLength: 2, maxLength: 100 }
                role: { type: string, enum: [seeker, employer] }
                locale: { $ref: "#/components/schemas/Locale" }
      responses:
        "201": { $ref: "#/components/responses/Auth" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      parameters: [{ $ref: "#/components/parameters/ClientType" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/google:
    post:
      tags: [auth]
      summary: Sign in with a Google ID token (creates the account on first use)
      parameters: [{ $ref: "#/components/parameters/ClientType" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
                role: { type: string, enum: [seeker, employer], description: used only for new accounts }
                locale: { $ref: "#/components/schemas/Locale" }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and get a new access token
      description: |
        `refresh_race` (401) means a parallel request already rotated the token: retry once.
        Reusing an old refresh token later revokes the whole session.
      parameters: [{ $ref: "#/components/parameters/ClientType" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { refresh_token: { type: string, description: mobile only } }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the session that owns the given refresh token
      parameters: [{ $ref: "#/components/parameters/ClientType" }]
      responses: { "204": { $ref: "#/components/responses/NoContent" } }
  /auth/logout-all:
    post:
      tags: [auth]
      security: [{ bearer: [] }]
      summary: Revoke every session of the current user
      responses: { "204": { $ref: "#/components/responses/NoContent" } }
  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Email a password reset code (always 204, never reveals if the email exists)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses: { "204": { $ref: "#/components/responses/NoContent" } }
  /auth/password/reset:
    post:
      tags: [auth]
      summary: Set a new password with the emailed code; signs out all sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{6}$" }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/Error" }
  /auth/email/send-code:
    post:
      tags: [auth]
      security: [{ bearer: [] }]
      summary: (Re)send the email verification code (60 s cooldown)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/email/verify:
    post:
      tags: [auth]
      security: [{ bearer: [] }]
      summary: Confirm the email with the 6-digit code
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Code" } } } }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/Error" }
  /auth/phone/send-code:
    post:
      tags: [auth]
      security: [{ bearer: [] }]
      summary: Send a phone verification code through Telegram ("Verification Codes" chat)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone], properties: { phone: { type: string, examples: ["+998 90 123 45 67"] } } }
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      phone: { type: string, description: normalized E.164 }
                      channel: { type: string, const: telegram }
                      expires_in: { type: integer, description: seconds }
                      dev_code: { type: string, description: "Test mode only (no Telegram gateway token, never in production): the code itself." }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/phone/verify:
    post:
      tags: [auth]
      security: [{ bearer: [] }]
      summary: Confirm the phone number with the code from Telegram
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Code" } } } }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/Error" }
  /me:
    get:
      tags: [me]
      security: [{ bearer: [] }]
      summary: Current user
      responses: { "200": { $ref: "#/components/responses/User" } }
    patch:
      tags: [me]
      security: [{ bearer: [] }]
      summary: Update name or language
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string, minLength: 2, maxLength: 100 }
                locale: { $ref: "#/components/schemas/Locale" }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "422": { $ref: "#/components/responses/Error" }
  /me/password:
    put:
      tags: [me]
      security: [{ bearer: [] }]
      summary: Change password (signs out other sessions); Google-only accounts may omit current_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/Error" }
  /me/sessions:
    get:
      tags: [me]
      security: [{ bearer: [] }]
      summary: Active sessions (devices)
      responses:
        "200":
          description: Sessions, most recently used first
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: array, items: { $ref: "#/components/schemas/Session" } } }
  /me/sessions/{id}:
    delete:
      tags: [me]
      security: [{ bearer: [] }]
      summary: Sign out one device
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "404": { $ref: "#/components/responses/Error" }

  /me/companies:
    get:
      tags: [companies]
      security: [{ bearer: [] }]
      summary: Companies the current user belongs to (with my_role)
      responses:
        "200":
          description: Companies
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Company" } } } }

  /catalog/categories:
    get:
      tags: [catalog]
      summary: Category tree (ETag + Cache-Control; send If-None-Match to get 304)
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Category" } } } }
        "304": { description: Not modified }
  /catalog/regions:
    get:
      tags: [catalog]
      summary: Regions with their districts (ETag cached)
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Region" } } } }
        "304": { description: Not modified }
  /catalog/skills:
    get:
      tags: [catalog]
      summary: Skill autocomplete; without q returns the most popular
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 50, default: 15 } }
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Skill" } } } }

  /companies:
    get:
      tags: [companies]
      summary: Company directory (verified first, then by open vacancies), 24 per page
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Company" } }
                  meta: { type: object, properties: { next_page: { type: [integer, "null"] } } }
    post:
      tags: [companies]
      security: [{ bearer: [] }]
      summary: Create a company (employer with a verified email or phone); caller becomes owner
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CompanyInput" } } } }
      responses:
        "201": { $ref: "#/components/responses/Company" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /companies/{company}:
    parameters: [{ $ref: "#/components/parameters/CompanyRef" }]
    get:
      tags: [companies]
      summary: Public company profile
      responses:
        "200": { $ref: "#/components/responses/Company" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [companies]
      security: [{ bearer: [] }]
      summary: Replace the profile (owner/admin). The slug never changes.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CompanyInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/Company" }
        "403": { $ref: "#/components/responses/Error" }
  /companies/{company}/members:
    parameters: [{ $ref: "#/components/parameters/CompanyRef" }]
    get:
      tags: [companies]
      security: [{ bearer: [] }]
      summary: Team members (any member)
      responses: { "200": { description: Members } }
    post:
      tags: [companies]
      security: [{ bearer: [] }]
      summary: Add an existing employer account by email (owner/admin; only the owner grants admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties: { email: { type: string, format: email }, role: { type: string, enum: [admin, recruiter] } }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /companies/{company}/members/{user}:
    delete:
      tags: [companies]
      security: [{ bearer: [] }]
      summary: Remove a member (owner/admin) or leave the company (yourself)
      parameters:
        - { $ref: "#/components/parameters/CompanyRef" }
        - { name: user, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { "204": { $ref: "#/components/responses/NoContent" } }
  /companies/{company}/vacancies:
    parameters: [{ $ref: "#/components/parameters/CompanyRef" }]
    get:
      tags: [vacancies]
      security: [{ bearer: [] }]
      summary: Employer dashboard — all of the company's vacancies, newest first
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/VacancyStatus" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { $ref: "#/components/responses/VacancyPage" } }
    post:
      tags: [vacancies]
      security: [{ bearer: [] }]
      summary: Create a draft vacancy (any member)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VacancyInput" } } } }
      responses:
        "201": { $ref: "#/components/responses/Vacancy" }
        "422": { $ref: "#/components/responses/Error" }

  /vacancies:
    get:
      tags: [vacancies]
      summary: Search and list published vacancies (keyset pagination)
      description: |
        `q` matches across scripts and languages: "dasturchi", "дастурчи" and "Dasturchilar"
        find the same vacancies; Russian inflections ("продажам") and Uzbek suffixes are
        handled by prefix-stemming. Title, skills, company, category and region names are all
        searchable (weighted in that order). If nothing matches exactly, a typo-tolerant title
        search runs and `meta.fuzzy` is true ("showing similar results").

        Ordering: `relevance` (default with `q`) or `newest` (default without `q`).
        Multi-value filters accept repeated params or comma lists (work_format=remote,hybrid).
        A parent category_id includes its subcategories. Results are cached ~30 s.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, newest] } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: region_id, in: query, schema: { type: integer } }
        - { name: district_id, in: query, schema: { type: integer } }
        - { name: company_id, in: query, schema: { type: string, format: uuid } }
        - { name: employment_type, in: query, schema: { type: string } }
        - { name: work_format, in: query, schema: { type: string } }
        - { name: experience, in: query, schema: { type: string } }
        - { name: schedule, in: query, schema: { type: string } }
        - { name: salary_from, in: query, schema: { type: integer } }
        - { name: currency, in: query, schema: { type: string, enum: [UZS, USD], default: UZS } }
        - { name: with_salary, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/VacancyPage" }
        "422": { $ref: "#/components/responses/Error" }
  /vacancies/{vacancy}:
    parameters: [{ $ref: "#/components/parameters/VacancyRef" }]
    get:
      tags: [vacancies]
      summary: Vacancy page. Unpublished vacancies are 404 except for company members.
      responses:
        "200": { $ref: "#/components/responses/Vacancy" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [vacancies]
      security: [{ bearer: [] }]
      summary: Replace a vacancy. A live vacancy of an unverified company goes back to moderation.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VacancyInput" } } } }
      responses: { "200": { $ref: "#/components/responses/Vacancy" } }
    delete:
      tags: [vacancies]
      security: [{ bearer: [] }]
      summary: Delete a draft (other statuses must be archived)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "409": { $ref: "#/components/responses/Error" }
  /vacancies/{vacancy}/submit:
    post:
      tags: [vacancies]
      security: [{ bearer: [] }]
      summary: Send to moderation (or publish directly for verified companies); also re-publishes archived/expired
      parameters: [{ $ref: "#/components/parameters/VacancyRef" }]
      responses:
        "200": { $ref: "#/components/responses/Vacancy" }
        "409": { $ref: "#/components/responses/Error" }
  /vacancies/{vacancy}/archive:
    post:
      tags: [vacancies]
      security: [{ bearer: [] }]
      summary: Close the vacancy
      parameters: [{ $ref: "#/components/parameters/VacancyRef" }]
      responses:
        "200": { $ref: "#/components/responses/Vacancy" }
        "409": { $ref: "#/components/responses/Error" }

  /search/suggest:
    get:
      tags: [search]
      summary: Search box autocomplete — vacancy titles (with counts), companies, skills
      parameters: [{ name: q, in: query, required: true, schema: { type: string, maxLength: 100 } }]
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      titles:
                        type: array
                        items: { type: object, properties: { title: { type: string }, vacancies: { type: integer } } }
                      companies: { type: array, items: { $ref: "#/components/schemas/CompanySummary" } }
                      skills: { type: array, items: { $ref: "#/components/schemas/Skill" } }
  /search/popular:
    get:
      tags: [search]
      summary: Most searched queries of the last 7 days (for the home page)
      responses:
        "200":
          description: Queries
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { type: string } } } }

  /admin/stats:
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Overview counters (what needs attention, platform size)
      responses:
        "200":
          description: Counters
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AdminStats" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
  /admin/stats/activity:
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Daily activity for the period with period-over-period totals
      parameters: [{ $ref: "#/components/parameters/StatsDays" }]
      responses:
        "200":
          description: Activity
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AdminActivity" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/stats/breakdown:
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Top categories and regions by vacancies published, and the application funnel
      parameters: [{ $ref: "#/components/parameters/StatsDays" }]
      responses:
        "200":
          description: Breakdown
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/AdminBreakdown" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/companies:
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: All companies, newest first. status and verified filter independently.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: name or slug substring }
        - { name: status, in: query, schema: { type: string, enum: [active, blocked] } }
        - { name: verified, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/AdminLimit" }
      responses:
        "200":
          description: Page of companies
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminCompany" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "400": { $ref: "#/components/responses/InvalidCursor" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/companies/{company}/verification:
    parameters: [{ $ref: "#/components/parameters/CompanyRef" }]
    put:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Mark verified (badge + publishing without moderation). Idempotent.
      responses:
        "200": { $ref: "#/components/responses/AdminCompany" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/CompanyNotFound" }
    delete:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Remove verification. Idempotent.
      responses:
        "200": { $ref: "#/components/responses/AdminCompany" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/CompanyNotFound" }
  /admin/companies/{company}/block:
    parameters: [{ $ref: "#/components/parameters/CompanyRef" }]
    put:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Block. The profile and every vacancy are hidden from the public and members can't manage the company. Idempotent.
      responses:
        "200": { $ref: "#/components/responses/AdminCompany" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/CompanyNotFound" }
    delete:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Unblock. Vacancies that haven't expired meanwhile become visible again. Idempotent.
      responses:
        "200": { $ref: "#/components/responses/AdminCompany" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/CompanyNotFound" }
  /admin/skills:
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Skill directory (user-added skills to review, rename, merge or delete)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: name or slug substring }
        - { name: verified, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, popularity, in_use], default: newest }, description: "newest: review queue order; popularity: autocomplete ranking; in_use: most vacancies + resumes listing it now. A cursor only works with the sort that issued it." }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/AdminLimit" }
      responses:
        "200":
          description: Page of skills
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminSkill" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "400": { $ref: "#/components/responses/InvalidCursor" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/skills/verification:
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: >-
        Verify several skills at once (the review queue's bulk action). All or nothing: if
        any id is unknown nothing changes (422 ids = not_found). Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: integer, minimum: 1 }, minItems: 1, maxItems: 100, uniqueItems: true, description: "at most the admin page size (AdminLimit max)" }
      responses:
        "200":
          description: The verified skills, by name
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/AdminSkill" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/skills/{skill}:
    parameters: [{ $ref: "#/components/parameters/SkillRef" }]
    patch:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: >-
        Rename (fix spelling). The old name stays as an alias. Vacancy and resume search
        picks up the new name in the background, usually within seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 50 } } }
      responses:
        "200": { $ref: "#/components/responses/AdminSkill" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/SkillNotFound" }
        "409": { description: "skill_exists: another skill already has this name or alias; merge into it instead", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Delete the skill and remove it from every vacancy and resume (search is refreshed in the background)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/SkillNotFound" }
  /admin/skills/{skill}/verification:
    parameters: [{ $ref: "#/components/parameters/SkillRef" }]
    put:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Mark reviewed; verified skills are suggested in autocomplete. Idempotent.
      responses:
        "200": { $ref: "#/components/responses/AdminSkill" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/SkillNotFound" }
    delete:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Take verification back. Idempotent.
      responses:
        "200": { $ref: "#/components/responses/AdminSkill" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/SkillNotFound" }
  /admin/skills/{skill}/merge:
    parameters: [{ $ref: "#/components/parameters/SkillRef" }]
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: >-
        Merge this skill into another (duplicates such as "React.js" → "React"). Every
        vacancy and resume moves to the target, this skill's names become the target's
        aliases, and this skill is deleted. Answers with the target. Search is refreshed in
        the background.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [into], properties: { into: { type: integer, minimum: 1, description: id of the skill that survives } } }
      responses:
        "200": { $ref: "#/components/responses/AdminSkill" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { description: "skill_not_found: the skill in the path (the one being merged away) doesn't exist", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "validation_failed; fields.into = not_found (no such target) or not_self (merging a skill into itself)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/users:
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: All accounts except deleted ones, newest first
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: name, email or phone substring }
        - { name: role, in: query, schema: { type: string, enum: [seeker, employer, admin] } }
        - { name: status, in: query, schema: { type: string, enum: [active, blocked] } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/AdminLimit" }
      responses:
        "200":
          description: Page of users
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "400": { $ref: "#/components/responses/InvalidCursor" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/users/{user}/role:
    parameters: [{ $ref: "#/components/parameters/UserRef" }]
    put:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Change the platform role and sign the user out everywhere (the role is inside their tokens)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], properties: { role: { type: string, enum: [seeker, employer, admin] } } }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not an admin (forbidden), or the target is yourself (admin_cannot_change_own_role)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/users/{user}/block:
    parameters: [{ $ref: "#/components/parameters/UserRef" }]
    put:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Block and sign out everywhere; login and refresh are refused while blocked. Idempotent.
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not an admin (forbidden), or the target is yourself (admin_cannot_block_self)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/UserNotFound" }
    delete:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Unblock. Idempotent.
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not an admin (forbidden), or the target is yourself (admin_cannot_block_self)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/UserNotFound" }
  /admin/vacancies/moderation:
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Moderation queue, oldest submission first
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/AdminLimit" }]
      responses:
        "200": { $ref: "#/components/responses/VacancyPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "400": { $ref: "#/components/responses/InvalidCursor" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/vacancies/{vacancy}/approve:
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Publish for 30 days
      parameters: [{ $ref: "#/components/parameters/VacancyRef" }]
      responses:
        "200": { $ref: "#/components/responses/Vacancy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/vacancies/{vacancy}/reject:
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Reject with a reason shown to the employer
      parameters: [{ $ref: "#/components/parameters/VacancyRef" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 1000 } } }
      responses:
        "200": { $ref: "#/components/responses/Vacancy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/vacancies/{vacancy}/takedown:
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Take a published vacancy down (it becomes rejected with the reason; the author gets vacancy.taken_down)
      description: >
        With resolve_reports (the default) the vacancy's open reports are closed as resolved in
        the same call, with the reason as the note, and the reporters are told. If closing the
        reports fails after the takedown, the takedown still stands and the reports stay open
        in the admin queue.
      parameters: [{ $ref: "#/components/parameters/VacancyRef" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 1000 }
                resolve_reports: { type: boolean, default: true }
      responses:
        "200": { $ref: "#/components/responses/Vacancy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "Not published (invalid_status_transition)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /admin/reports:
    get:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Reported vacancies and companies, newest report first
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, dismissed], default: open } }
        - { name: target_type, in: query, schema: { type: string, enum: [vacancy, company] } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/AdminLimit" }
      responses:
        "200":
          description: Page of reported targets
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ReportedTarget" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/InvalidCursor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/reports/{target_type}/{target_id}/resolve:
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Close every open report of the target as resolved (action taken) and tell the reporters
      parameters: [{ $ref: "#/components/parameters/ReportTargetType" }, { $ref: "#/components/parameters/ReportTargetId" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 1000, description: internal, not shown to reporters } } }
      responses:
        "200": { $ref: "#/components/responses/ReportedTarget" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/ReportedTargetNotFound" }
        "409": { description: "Nothing open (no_open_reports)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /admin/reports/{target_type}/{target_id}/dismiss:
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      summary: Close every open report of the target as dismissed (no violation) and tell the reporters
      parameters: [{ $ref: "#/components/parameters/ReportTargetType" }, { $ref: "#/components/parameters/ReportTargetId" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 1000, description: internal, not shown to reporters } } }
      responses:
        "200": { $ref: "#/components/responses/ReportedTarget" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminOnly" }
        "404": { $ref: "#/components/responses/ReportedTargetNotFound" }
        "409": { description: "Nothing open (no_open_reports)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /reports:
    post:
      tags: [reports]
      security: [{ bearer: [] }]
      summary: Report a public vacancy or company (10 per hour per user)
      description: >
        A second report on the same target while the first is still open answers 409
        already_reported; clients show "already reported" for it (there's no lookup endpoint).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, reason]
              properties:
                target_type: { type: string, enum: [vacancy, company] }
                target_id: { type: string, format: uuid, description: "missing or malformed → 422 fields.target_id" }
                reason: { $ref: "#/components/schemas/ReportReason" }
                comment: { type: string, maxLength: 1000, description: "required when reason is other" }
      responses:
        "201":
          description: Filed
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Report" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Your own company or its vacancy (cannot_report_own_company)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/ReportTargetNotFound" }
        "409": { description: "You already have an open report on it (already_reported)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /resumes:
    get:
      tags: [resumes]
      security: [{ bearer: [] }]
      summary: Candidate search (employers). Public resumes only; no contacts in results.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, updated] } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: region_id, in: query, schema: { type: integer } }
        - { name: with_relocate, in: query, schema: { type: boolean }, description: also candidates willing to relocate }
        - { name: experience, in: query, schema: { type: string }, description: "none,1_3,3_6,6_plus (comma list)" }
        - { name: salary_to, in: query, schema: { type: integer } }
        - { name: currency, in: query, schema: { type: string, enum: [UZS, USD] } }
        - { name: employment_type, in: query, schema: { type: string } }
        - { name: work_format, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ResumeCard" } }
                  meta: { type: object }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [resumes]
      security: [{ bearer: [] }]
      summary: Create a resume (seekers, max 5)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResumeInput" } } } }
      responses:
        "201": { $ref: "#/components/responses/Resume" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /resumes/{resume}:
    parameters: [{ $ref: "#/components/parameters/ResumeRef" }]
    get:
      tags: [resumes]
      security: [{ bearer: [] }]
      summary: A resume, subject to visibility rules (404 when not visible)
      responses: { "200": { $ref: "#/components/responses/Resume" }, "404": { $ref: "#/components/responses/Error" } }
    put:
      tags: [resumes]
      security: [{ bearer: [] }]
      summary: Replace a resume (owner)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResumeInput" } } } }
      responses: { "200": { $ref: "#/components/responses/Resume" } }
    delete:
      tags: [resumes]
      security: [{ bearer: [] }]
      summary: Delete (not allowed once sent with an application — hide it instead)
      responses: { "204": { $ref: "#/components/responses/NoContent" }, "409": { $ref: "#/components/responses/Error" } }
  /resumes/{resume}/visibility:
    put:
      tags: [resumes]
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResumeRef" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [visibility], properties: { visibility: { $ref: "#/components/schemas/ResumeVisibility" } } } } }
      responses: { "200": { $ref: "#/components/responses/Resume" } }
  /resumes/{resume}/pdf:
    get:
      tags: [resumes]
      security: [{ bearer: [] }]
      summary: Download as PDF (contacts only if the viewer may see them)
      parameters:
        - { $ref: "#/components/parameters/ResumeRef" }
        - { name: lang, in: query, schema: { $ref: "#/components/schemas/Locale" } }
      responses: { "200": { description: PDF, content: { application/pdf: {} } } }
  /resumes/{resume}/invite:
    post:
      tags: [applications]
      security: [{ bearer: [] }]
      summary: Invite the candidate to one of your company's published vacancies
      parameters: [{ $ref: "#/components/parameters/ResumeRef" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [vacancy_id], properties: { vacancy_id: { type: string, format: uuid }, message: { type: string, maxLength: 2000 } } }
      responses:
        "201": { $ref: "#/components/responses/Application" }
        "409": { $ref: "#/components/responses/Error" }
  /me/resumes:
    get:
      tags: [resumes]
      security: [{ bearer: [] }]
      summary: My resumes
      responses: { "200": { description: Resumes } }

  /vacancies/{vacancy}/applications:
    parameters: [{ $ref: "#/components/parameters/VacancyRef" }]
    post:
      tags: [applications]
      security: [{ bearer: [] }]
      summary: Apply (seeker with verified email or phone)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [resume_id], properties: { resume_id: { type: string, format: uuid }, cover_letter: { type: string, maxLength: 3000 } } }
      responses:
        "201": { $ref: "#/components/responses/Application" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      tags: [applications]
      security: [{ bearer: [] }]
      summary: Applications for a vacancy (company members), newest first
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ApplicationStatus" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: Page of applications with candidate summaries } }
  /vacancies/{vacancy}/applications/stats:
    get:
      tags: [applications]
      security: [{ bearer: [] }]
      summary: Count per pipeline column (kanban header)
      parameters: [{ $ref: "#/components/parameters/VacancyRef" }]
      responses: { "200": { description: "{status: count}" } }
  /applications/{application}:
    get:
      tags: [applications]
      security: [{ bearer: [] }]
      summary: Application with history; the first employer view marks it "viewed"
      parameters: [{ $ref: "#/components/parameters/ApplicationRef" }]
      responses: { "200": { $ref: "#/components/responses/Application" }, "404": { $ref: "#/components/responses/Error" } }
  /applications/{application}/status:
    put:
      tags: [applications]
      security: [{ bearer: [] }]
      summary: Move the card (employer). Withdrawn applications can't be moved.
      parameters: [{ $ref: "#/components/parameters/ApplicationRef" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [viewed, invited, interview, hired, rejected] }
                note: { type: string, maxLength: 2000, description: internal to the hiring team }
      responses: { "200": { $ref: "#/components/responses/Application" }, "409": { $ref: "#/components/responses/Error" } }
  /applications/{application}/note:
    put:
      tags: [applications]
      security: [{ bearer: [] }]
      summary: Private hiring-team note
      parameters: [{ $ref: "#/components/parameters/ApplicationRef" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { note: { type: string, maxLength: 5000 } } } } } }
      responses: { "200": { $ref: "#/components/responses/Application" } }
  /applications/{application}/withdraw:
    post:
      tags: [applications]
      security: [{ bearer: [] }]
      summary: Withdraw (seeker)
      parameters: [{ $ref: "#/components/parameters/ApplicationRef" }]
      responses: { "200": { $ref: "#/components/responses/Application" }, "409": { $ref: "#/components/responses/Error" } }
  /me/applications:
    get:
      tags: [applications]
      security: [{ bearer: [] }]
      summary: My applications with vacancy cards
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ApplicationStatus" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: Page } }

  /vacancies/{vacancy}/save:
    parameters: [{ $ref: "#/components/parameters/VacancyRef" }]
    put:
      tags: [vacancies]
      security: [{ bearer: [] }]
      summary: Bookmark a published vacancy (idempotent)
      responses: { "204": { $ref: "#/components/responses/NoContent" } }
    delete:
      tags: [vacancies]
      security: [{ bearer: [] }]
      summary: Remove bookmark
      responses: { "204": { $ref: "#/components/responses/NoContent" } }
  /me/saved-vacancies:
    get:
      tags: [vacancies]
      security: [{ bearer: [] }]
      summary: Bookmarked vacancies, most recent first
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/VacancyPage" } }
  /me/saved-vacancies/ids:
    get:
      tags: [vacancies]
      security: [{ bearer: [] }]
      summary: Ids of bookmarked vacancies (to mark cards in cached listings)
      responses: { "200": { description: "{data: [uuid]}" } }

  /files:
    post:
      tags: [files]
      security: [{ bearer: [] }]
      summary: Start an upload (returns a presigned POST; size and type are enforced by storage)
      description: |
        Limits: avatar / company_logo — jpeg, png, webp ≤ 5 MB (public URL);
        chat_image — jpeg, png, webp, gif ≤ 10 MB; chat_voice — webm, ogg, m4a (audio/mp4), mp3, aac ≤ 5 MB;
        chat_file — pdf, doc(x), xls(x), ppt(x), txt, zip, rar, jpeg, png ≤ 25 MB (private, signed URLs).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, content_type, size]
              properties:
                purpose: { type: string, enum: [avatar, company_logo, chat_image, chat_file, chat_voice] }
                content_type: { type: string }
                size: { type: integer }
                name: { type: string }
                meta: { type: object, additionalProperties: true, description: "{duration_ms} for voice, {width,height} for images" }
      responses: { "201": { description: "{file, upload: {url, method, fields}}" }, "422": { $ref: "#/components/responses/Error" } }
  /files/{file}/complete:
    post:
      tags: [files]
      security: [{ bearer: [] }]
      summary: Verify the uploaded bytes (type sniffing) and mark the file ready
      parameters: [{ name: file, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: File with url }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/avatar:
    put:
      tags: [me]
      security: [{ bearer: [] }]
      summary: Set (file_id) or remove (null) the avatar
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { file_id: { type: [string, "null"], format: uuid } } } } } }
      responses: { "200": { $ref: "#/components/responses/User" } }
  /companies/{company}/logo:
    put:
      tags: [companies]
      security: [{ bearer: [] }]
      summary: Set or remove the company logo (owner/admin)
      parameters: [{ $ref: "#/components/parameters/CompanyRef" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { file_id: { type: [string, "null"], format: uuid } } } } } }
      responses: { "200": { $ref: "#/components/responses/Company" } }

  /me/notifications:
    get:
      tags: [notifications]
      security: [{ bearer: [] }]
      summary: In-app notifications, newest first
      description: "See the Notification schema for the types and their payloads."
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 50 } }
      responses:
        "200":
          description: Page of notifications
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /me/notifications/unread-count:
    get:
      tags: [notifications]
      security: [{ bearer: [] }]
      summary: Badge count
      responses: { "200": { description: "{unread}" } }
  /me/notifications/read:
    post:
      tags: [notifications]
      security: [{ bearer: [] }]
      summary: Mark given ids (or all, if empty) as read
      requestBody: { content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: integer } } } } } } }
      responses: { "204": { $ref: "#/components/responses/NoContent" } }
  /me/notification-settings:
    get:
      tags: [notifications]
      security: [{ bearer: [] }]
      summary: Delivery channels (email, telegram) and whether Telegram is linked
      responses: { "200": { description: "{email, telegram, telegram_linked, telegram_bot}" } }
    put:
      tags: [notifications]
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { email: { type: boolean }, telegram: { type: boolean } } } } } }
      responses: { "200": { description: Settings } }
  /me/telegram/link:
    post:
      tags: [notifications]
      security: [{ bearer: [] }]
      summary: Deep link (t.me/<bot>?start=<token>, 15 min) that connects the user's Telegram
      responses: { "200": { description: "{url, expires_in}" } }
  /me/telegram:
    delete:
      tags: [notifications]
      security: [{ bearer: [] }]
      summary: Disconnect Telegram
      responses: { "204": { $ref: "#/components/responses/NoContent" } }
  /me/devices:
    post:
      tags: [notifications]
      security: [{ bearer: [] }]
      summary: Register a push token (FCM)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, platform], properties: { token: { type: string }, platform: { type: string, enum: [android, ios, web] } } } } } }
      responses: { "204": { $ref: "#/components/responses/NoContent" } }
  /me/devices/{token}:
    delete:
      tags: [notifications]
      security: [{ bearer: [] }]
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses: { "204": { $ref: "#/components/responses/NoContent" } }
  /telegram/webhook:
    post:
      tags: [notifications]
      summary: Telegram Bot API webhook (requires X-Telegram-Bot-Api-Secret-Token)
      responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Error" } }

  /ws/ticket:
    post:
      tags: [realtime]
      security: [{ bearer: [] }]
      summary: One-time WebSocket ticket (30 s)
      responses: { "200": { description: "{ticket, expires_in}" } }
  /ws:
    get:
      tags: [realtime]
      summary: WebSocket endpoint
      parameters: [{ name: ticket, in: query, required: true, schema: { type: string } }]
      responses: { "101": { description: Switching protocols }, "401": { $ref: "#/components/responses/Error" } }
  /ws/presence:
    get:
      tags: [realtime]
      security: [{ bearer: [] }]
      summary: Online status of up to 200 users
      parameters: [{ name: ids, in: query, required: true, schema: { type: string }, description: comma-separated uuids }]
      responses: { "200": { description: "[{user_id, online, last_seen_at}]" } }

  /applications/{application}/conversation:
    post:
      tags: [chat]
      security: [{ bearer: [] }]
      summary: Open (or create) the chat of an application — seeker or company member
      parameters: [{ $ref: "#/components/parameters/ApplicationRef" }]
      responses: { "200": { description: Conversation }, "404": { $ref: "#/components/responses/Error" } }
  /conversations:
    get:
      tags: [chat]
      security: [{ bearer: [] }]
      summary: My conversations, most recent first, with last message and unread count
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: Page } }
  /conversations/unread-count:
    get:
      tags: [chat]
      security: [{ bearer: [] }]
      summary: Number of conversations with unread messages
      responses: { "200": { description: "{conversations}" } }
  /conversations/{conversation}:
    get:
      tags: [chat]
      security: [{ bearer: [] }]
      parameters: [{ name: conversation, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: "Conversation (side, unread, read_up_to of the other side)" } }
  /conversations/{conversation}/messages:
    parameters: [{ name: conversation, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [chat]
      security: [{ bearer: [] }]
      summary: Messages newest first; ?before=<id> for history, ?after=<id> to catch up
      parameters:
        - { name: before, in: query, schema: { type: integer } }
        - { name: after, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses: { "200": { description: "Messages; meta.next_before" } }
    post:
      tags: [chat]
      security: [{ bearer: [] }]
      summary: Send (idempotent by client_id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, kind]
              properties:
                client_id: { type: string, format: uuid }
                kind: { type: string, enum: [text, image, file, voice, location] }
                body: { type: string, maxLength: 4000, description: text, or caption (≤1000) }
                file_id: { type: string, format: uuid, description: "image: chat_image, file: chat_file, voice: chat_voice" }
                location: { type: object, properties: { lat: { type: number }, lng: { type: number }, name: { type: string } } }
      responses: { "201": { description: Message }, "422": { $ref: "#/components/responses/Error" } }
  /conversations/{conversation}/read:
    post:
      tags: [chat]
      security: [{ bearer: [] }]
      summary: Move my read position forward (also available as a WebSocket frame)
      parameters: [{ name: conversation, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [message_id], properties: { message_id: { type: integer } } } } } }
      responses: { "204": { $ref: "#/components/responses/NoContent" } }
  /messages/{message}:
    delete:
      tags: [chat]
      security: [{ bearer: [] }]
      summary: Delete my message (within 48 h)
      parameters: [{ name: message, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { $ref: "#/components/responses/NoContent" }, "409": { $ref: "#/components/responses/Error" } }

  /me/saved-searches:
    get:
      tags: [search]
      security: [{ bearer: [] }]
      summary: Saved vacancy searches
      responses: { "200": { description: List } }
    post:
      tags: [search]
      security: [{ bearer: [] }]
      summary: Save a search (params = /vacancies query string); alerts for new matches every 30 min
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, params], properties: { name: { type: string }, params: { type: string, examples: ["q=dasturchi&region_id=1&work_format=remote"] }, notify: { type: boolean } } }
      responses: { "201": { description: Saved search }, "409": { $ref: "#/components/responses/Error" } }
  /me/saved-searches/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      tags: [search]
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, notify: { type: boolean } } } } } }
      responses: { "200": { description: Saved search } }
    delete:
      tags: [search]
      security: [{ bearer: [] }]
      responses: { "204": { $ref: "#/components/responses/NoContent" } }
